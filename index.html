<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E2E2E3">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Grimoire Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#E2E2E3;--card:#F3F3F3;--sub:#D3D3D3;--tx:#2B2B2D;--tx2:#5F6062;--ac:#6D6E70;--ac2:#AAAAAB;--bd:#C2C2C3;--ink:#2A2326;--pg:#555556;--inp:#fff;--h1:#AAAAAB;--h2:#6D6E70;--h3:#3a3a3c;--ph1:#6D6E70;--ph2:#AAAAAB;--ph3:#3a3a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#1b1b1d;--card:#262629;--sub:#35353a;--tx:#e9e9ec;--tx2:#a2a2aa;--ac:#5f5f68;--ac2:#6b6b74;--bd:#3f3f45;--ink:#e9e9ec;--pg:#7b7b86;--inp:#1f1f22;--h1:#4a4a52;--h2:#6a6a73;--h3:#8a8a94;--ph1:#8a8a94;--ph2:#5a5a62;--ph3:#d4d4dc;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.8 "Noto Sans JP","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",sans-serif;font-weight:500;overflow-x:hidden;overscroll-behavior-y:none}
h1,h2,h3{font-weight:700;margin:0 0 8px;letter-spacing:.03em}
h1{font-size:22px;text-align:center}h2{font-size:19px}h3{font-size:17px}
#app{max-width:520px;margin:0 auto;padding:14px 14px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,40,45,.06)}
.card.deco{border-top:3px solid var(--ac2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mut{color:var(--tx2);font-size:15px}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
button.sm{min-height:38px;padding:4px 10px;font-size:15px}
button.on{background:var(--pg);border-color:var(--pg);color:#fff}
input,textarea,select{font:inherit;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--inp);color:var(--tx)}
.bar{height:12px;background:var(--sub);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pg);transition:width .4s}
.bub{background:var(--sub);border-radius:14px;padding:10px 14px}
.bub.t{position:relative;flex:1}.bub.t:before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-left:0;border-right-color:var(--sub)}
.jace{background:none;border:0;padding:0;min-height:0;display:block;margin:0 auto}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.task:first-of-type{border-top:0}
.chk{width:24px;height:24px;min-width:24px;min-height:24px;margin-top:5px;border-radius:50%;padding:0;background:transparent;border:2px solid var(--ac);color:#fff;font-size:13px;line-height:1}
.chk.d{background:var(--pg);border-color:var(--pg)}
.done .tt{text-decoration:line-through;color:var(--tx2)}
nav{position:fixed;left:0;right:0;bottom:0;transform:translateZ(0);-webkit-transform:translateZ(0);background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:transparent;color:var(--tx2);border:0;border-radius:0;font-size:11px;min-height:56px;padding:4px 0;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:9;max-width:88%;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.s{opacity:1}
.tag{display:inline-block;background:var(--sub);border-radius:10px;padding:0 8px;font-size:13px}
.sw{position:relative;overflow:hidden;border-top:1px solid var(--bd)}.sw .task{border-top:0}.acts{position:absolute;right:0;top:0;bottom:0;display:flex}.acts button{min-height:0;height:100%;width:72px;border-radius:0;border:0;padding:0}.acts button.ghost{background:var(--sub);color:var(--tx)}.acts button.del{background:#6b4a4f}.swi{position:relative;background:var(--card);transition:transform .2s;touch-action:pan-y;user-select:none;-webkit-user-select:none}.ov{position:fixed;inset:0;background:rgba(30,30,34,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.mb{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px}
input[type=date],input[type=time]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}.bub.red{background:#B5474E;color:#fff}.bub.t.red:before{border-right-color:#B5474E}
.mb{max-height:88vh;overflow:auto}
.cp{min-height:34px;padding:3px 8px;font-size:14px;border-radius:10px}
.tiny{min-height:0;padding:2px 10px;font-size:12px;background:transparent;color:var(--tx2);border:1px solid var(--bd);border-radius:8px}
.big{font-size:46px;text-align:center;letter-spacing:.08em;font-weight:700}
/* ---- ジェイスの部屋・隠れ家 ---- */
.room{display:block;width:100%;height:auto;border-radius:14px}
.room .r-lt{pointer-events:none}
.room .w-breathe{animation:wB 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.room .w-tail{animation:wT 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
.room .w-z{animation:wZ 4s ease-in-out infinite}
.room .fl{animation:wF 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.room .lt{animation:wL 3.4s ease-in-out infinite}
.room.listen .w-earL{transform:rotate(-9deg);transform-box:fill-box;transform-origin:50% 100%}
.room.listen .w-earR{transform:rotate(9deg);transform-box:fill-box;transform-origin:50% 100%}
@keyframes wH{0%,100%{transform:rotate(0)}30%{transform:rotate(2.2deg) translateY(1px)}62%{transform:rotate(-2deg)}}
.room .w-hw{animation:wH 9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wB{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes wT{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes wZ{50%{transform:translate(4px,-6px)}}
@keyframes wF{0%,100%{transform:scale(1,.94)}40%{transform:scale(1.06,1.1)}70%{transform:scale(.96,.98)}}
@keyframes wL{0%,100%{opacity:.85}35%{opacity:1}60%{opacity:.7}}
.dn2{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;background:radial-gradient(120% 80% at 50% 0%,#141c34 0%,#0a0f1c 70%);color:#c8ccd4;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
.dn2 *{box-sizing:border-box}
.dn2-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px}
.dn2-b{font:inherit;font-size:14px;min-height:36px;padding:5px 14px;border-radius:999px;border:1px solid rgba(200,204,212,.28);background:rgba(14,20,36,.6);color:#c8ccd4;cursor:pointer}
.dn2-b.on{background:rgba(224,160,80,.2);border-color:rgba(224,160,80,.55);color:#f3d9ac}
.dn2-stage{flex:none;width:100%;max-width:560px;margin:0 auto;padding:0 8px}
.dn2-text{min-height:4.2em;padding:12px 24px 2px;text-align:center;font-size:17px;line-height:1.9;color:#dadde4;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity 1.2s}
.dn2-sub{padding:0 24px;text-align:center;font-size:12.5px;line-height:1.7;color:#aab0bc}
.dn2-bot{margin-top:auto;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.dn2-in{display:flex;gap:8px;margin-top:8px}
.dn2-in input{flex:1;min-width:0;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid rgba(200,204,212,.28);background:rgba(14,20,36,.7);color:#e4e6ec;font:inherit;font-size:16px}
.dn2-in input::placeholder{color:#7d8496}
.dn2-sheet{position:absolute;left:12px;right:12px;top:58px;bottom:84px;overflow:auto;padding:12px 14px;border-radius:18px;background:rgba(10,14,28,.95);border:1px solid rgba(200,204,212,.18);display:none}
.dn2-sheet.on{display:block}
.dn2-sheet h4{margin:12px 0 6px;font-size:13px;color:#aab0bc;font-weight:500}
.dn2-sheet h4:first-child{margin-top:0}
.dn2-row{display:flex;flex-wrap:wrap;gap:6px}
.dn2-breath{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(6,9,18,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.dn2-breath.on{display:flex}
.dn2-bc{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(224,160,80,.6),rgba(224,160,80,.14) 62%,rgba(224,160,80,0));transform:scale(.55)}
.dn2-bl{font-size:20px;letter-spacing:.2em;color:#e8c98f}
.rm-chip{font:inherit;font-size:13px;min-height:32px;padding:3px 11px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.rm-chip.on{background:var(--pg);border-color:var(--pg);color:#fff}
.dn2-sheet .rm-chip{border-color:rgba(200,204,212,.28);color:#c8ccd4}
.dn2-sheet .rm-chip.on{background:rgba(224,160,80,.22);border-color:rgba(224,160,80,.55);color:#f3d9ac}

@keyframes wSg{0%,100%{transform:rotate(-2.6deg) translateY(0)}50%{transform:rotate(2.6deg) translateY(-2px)}}
.room.sing .w-hw{animation:wSg .62s ease-in-out infinite}
/* ---- Music English（ダークアカデミア調）---- */
.mu{background:linear-gradient(180deg,#17131c,#0e0c12);color:#e8e2ea;border:1px solid #2a2330;border-radius:16px;padding:12px;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.mu *{box-sizing:border-box}
.mu .mut{color:#9d95a8}
.mu-h{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mu-et{font-size:18px;font-weight:700;letter-spacing:.04em;color:#ecd9de}
.mu-entry{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px 12px}
.mu-eic{flex:none;display:inline-flex}
.mu .mc{background:#1e1a25;border:1px solid #302937;border-radius:12px;padding:10px 12px;margin:8px 0}
.mu .mc.merr{border-color:#8a3a4c;background:#251a20}
.mu .mc.mwarn{border-color:#6a5a3a;background:#231f19}
.mu .mc.mprev{border-color:#5a2a3a}
.mu .mc.mtheme{background:#241a22;border-color:#5a2a3a}
.mu .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu .mst b{display:block;font-size:19px;color:#f1e6ea}
.mu .mst .mut{font-size:12px}
.mu .mb{font:inherit;font-size:15px;min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid #8a3a4c;background:#6a2434;color:#f6e9ee;cursor:pointer}
.mu .mb.sm{min-height:34px;font-size:14px;padding:5px 11px}
.mu .mb.mb2{background:transparent;border-color:#4a4252;color:#d6cfdc}
.mu .mb:disabled{opacity:.45}
.mu .mkb{flex:none;font:inherit;font-size:20px;line-height:1;min-width:40px;min-height:40px;border-radius:10px;border:1px solid #3a3341;background:transparent;color:#cfc7d6}
.mu .mi{width:100%;display:block;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid #3a3341;background:#131018;color:#eee8f0;margin:3px 0}
.mu .mi::placeholder{color:#6f677a}
.mu .ml{display:block;font-size:13px;color:#b9b0c2;margin:10px 0 2px}
.mu .mreq{font-size:11px;color:#e09aa8;margin-left:4px}
.mu .mrow{display:flex;gap:12px;align-items:center;cursor:pointer}
.mu .mtx{flex:1;min-width:0}
.mu .mt1{font-weight:700;font-size:16px;color:#f1e6ea;word-break:break-word}
.mu .mt2{font-size:13px;color:#b9b0c2;word-break:break-word}
.mu .mt3{font-size:12px;color:#8b8396;margin-top:3px}
.mu .mcov{flex:none;border-radius:8px;object-fit:cover;background:#15121a;border:1px solid #302937;display:inline-flex;align-items:center;justify-content:center}
.mu .mchip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid #4a3a46;color:#d9c3cb;background:#251a21;margin:1px 2px 1px 0}
.mu .mchip.mok{border-color:#3d6a4c;color:#a9d6b6;background:#17241b;flex:none}
.mu .mtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.mu .mtab{flex:none;font:inherit;font-size:13px;min-height:36px;padding:5px 12px;border-radius:999px;border:1px solid #3a3341;background:transparent;color:#cfc7d6;white-space:nowrap}
.mu .mtab.on{background:#6a2434;border-color:#8a3a4c;color:#fff}
.mu .mtab .mn{opacity:.6;margin-right:5px;font-size:11px}
.mu .men{font-size:16px;font-weight:700;color:#f3e8ec;word-break:break-word}
.mu .mkv{display:flex;gap:8px;font-size:14px;line-height:1.7;margin-top:3px;word-break:break-word}
.mu .mk{flex:none;min-width:5.5em;font-size:12px;color:#c58b99;padding-top:2px}
.mu .mtags{display:flex;flex-wrap:wrap}
.mu .mq{font-size:15px;margin:8px 0 4px;color:#ece3e8}
.mu .mlink{display:inline-block;margin-top:6px;font-size:14px;color:#e0a0ae}
.mu summary{cursor:pointer;font-size:14px;color:#d6cfdc}
.mu code{font-size:12px;color:#e8b4c0;word-break:break-all}
.mu .bar{background:#2a2330}
.mu .bar i{background:#8a3a4c}
.mu .row.sp{display:flex;justify-content:space-between;align-items:center}
.mu .lr{display:flex;gap:6px;align-items:center;margin:4px 0}
.mu .lr .mi{margin:0;flex:1;min-width:0}
.mu .ln{flex:none;width:26px;text-align:right;font-size:12px;color:#8b8396}
.mu .mline .mlh{display:flex;gap:10px;align-items:flex-start;margin-bottom:2px}
.mu .mn2{flex:none;min-width:22px;font-size:12px;color:#c58b99;padding-top:4px;text-align:right}
.mu .mdt{margin-top:8px;border-top:1px solid #302937;padding-top:6px}
.mu .mdt summary{font-size:13px;color:#e0a0ae;padding:4px 0}
.mu .msec{font-size:12px;letter-spacing:.06em;color:#c58b99;margin:10px 0 2px;border-left:3px solid #6a2434;padding-left:7px}
.mu .mw{padding:6px 0;border-bottom:1px dashed #2e2833}
.mu .mw:last-child{border-bottom:0}
.mu .mdiff{border-top:1px solid #4a2a34;margin-top:8px;padding-top:6px}
.mu .mq2{font-size:14px;background:#14111a;border:1px solid #3a3341;border-radius:8px;padding:6px 8px;word-break:break-word;white-space:pre-wrap;margin-top:2px}

.mu .mwr{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 9px}
.mu .mpr{font-size:13px}
.mu .mmn{font-size:15px;color:#f1e6ea}
.mu .msp{flex:1 1 8px}
.mu .mwb{align-self:center;flex:none;margin-left:auto}
.mu .mwx{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:#cfc7d6;margin-top:3px;line-height:1.6}
.mu .mi2 .mk{min-width:0;margin-right:5px;font-size:11px}

/* ---- ジェイスと歌う ---- */
.sg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:radial-gradient(120% 70% at 50% 0%,#241822 0%,#120d16 62%,#0c0910 100%);color:#ece3e8;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
.sg *{box-sizing:border-box}
.sg-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 6px}
.sg-title{flex:1;min-width:0;text-align:center;font-size:13px;color:#b9a9b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-stage{position:relative;flex:none;width:100%;max-width:520px;margin:0 auto;padding:0 10px;cursor:pointer}
.sg-svg .room{max-height:36vh;width:auto;margin:0 auto}
.sg-notes{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden}
.sg-note{position:absolute;bottom:42%;color:#e0a0ae;opacity:0;text-shadow:0 0 8px rgba(224,160,174,.55);animation:sgUp 2.6s ease-out forwards}
@keyframes sgUp{0%{opacity:0;transform:translateY(0) rotate(-8deg)}15%{opacity:.95}100%{opacity:0;transform:translateY(-120px) translateX(18px) rotate(14deg)}}
.sg-say{min-height:1.6em;padding:4px 22px 0;text-align:center;font-size:14px;color:#c8b4bd}
.sg-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 22px;text-align:center;cursor:pointer;min-height:0;overflow:auto}
.sg-en{font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;font-size:clamp(22px,6.2vw,32px);line-height:1.55;word-break:break-word}
.sg-w{color:#5d5566;transition:color .25s,text-shadow .25s}
.sg-w.on{color:#f6ebef;text-shadow:0 0 12px rgba(224,160,174,.35)}
.sg-ja{margin-top:12px;font-size:15px;line-height:1.7;color:#b5a8b2}
.sg-intro{font-family:'Noto Serif JP','Hiragino Mincho ProN',Georgia,serif;font-size:24px;color:#f1dfe5}
.sg-sub{margin-top:6px;font-size:14px;color:#9d8e99}
.sg-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.sg-ct{font-size:13px;color:#9d8e99}

/* ---- 曲の画面：コンパクトな上部 ---- */
.mu .mhd{padding:8px 10px}
.mu .mhr{display:flex;gap:10px;align-items:center}
.mu .mhs{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-size:12px;color:#c9bfd0;margin-top:6px}
.mu .mhsing{margin-left:auto;min-height:32px}
.mu .mops{margin-top:4px}
.mu .mops summary{font-size:13px;color:#e0a0ae;padding:5px 0;cursor:pointer}
.mu .mops-b{padding-top:2px}
.mu .mops-t{font-size:11px;letter-spacing:.08em;color:#c58b99;margin:8px 0 4px}
.mu .mtheme summary{cursor:pointer;font-size:14px;color:#e7d9de}
.mu .mtheme[open] .mprev{display:none}
.mu .mtheme .mk{min-width:0}
.mu .mtabs{position:relative}
.mu .muai{padding:8px 10px}

/* ===== Grimoire Garden / unified redesign ===== */
:root{
 --bg:#ECECEC;--card:#F7F7F7;--sub:#E3E3E3;--tx:#2B2B2D;--tx2:#6A6B6D;
 --ac:#3A3A3C;--ac2:#B8B8BA;--bd:#D2D2D3;--ink:#2B2B2D;--pg:#3A3A3C;--inp:#FFFFFF;
 --danger:#B5474E;--radius:16px;color-scheme:light;
}
:root[data-theme=dark]{
 --bg:#1B1B1D;--card:#262629;--sub:#35353A;--tx:#E9E9EC;--tx2:#A2A2AA;
 --ac:#E9E9EC;--ac2:#6B6B74;--bd:#3F3F45;--ink:#E9E9EC;--pg:#E9E9EC;--inp:#1F1F22;color-scheme:dark;
}
html{scroll-behavior:smooth}
body{font:16px/1.6 "Noto Sans JP","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",sans-serif;font-weight:400;background:var(--bg);color:var(--tx)}
#app{max-width:520px;padding:16px 16px calc(112px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;line-height:1.4;text-align:left;margin:0 0 14px;letter-spacing:.02em}
h2{font-size:16px;line-height:1.45;margin:0;font-weight:700}
h3{font-size:15px;line-height:1.5;margin:0 0 8px}
.mut{font-size:13px;color:var(--tx2);line-height:1.55}

const WEAK_MIN=5;
const VL={

let vCur='',vSess=null,vDr={q:'',a:'',c:'',bulk:'',dn:''},stTab='rec',stLine='';
function vS(){const v=S.vocab=S.vocab||{};if(!v.decks)v.decks=[];if(v.sec==null)v.sec=0;if(!v.days)v.days=[];if(!v.day)v.day={};if(!v.cfg)v.cfg={filter:'all',order:'random',side:'q',tmode:'type',cat:''};return v}
function vDeck(){const v=vS();let d=v.decks.find(x=>x.id===vCur);if(!d){d=v.decks[0]||null;vCur=d?d.id:''}return d}
function vcGet(id){const d=vDeck();return d?d.cards.find(c=>c.id===id):null}
function isWeak(c){return c.st==='unknown'||c.ng>=2||(c.ok+c.ng>=3&&c.ok/(c.ok+c.ng)<0.6)}
function vAll(){return vS().decks.reduce((a,d)=>a.concat(d.cards),[])}
function vAcc(cards){const o=cards.reduce((a,c)=>a+c.ok,0),n=cards.reduce((a,c)=>a+c.ng,0);return o+n?Math.round(o/(o+n)*100):null}
function vTdy(){const v=vS(),td=jst();return v.day[td]||{ids:[],ok:0,ng:0,sec:0}}
function vStreak(){const v=vS(),d=new Set(v.days),td=jst();let cur=0,x=d.has(td)?td:addDay(td,-1);while(d.has(x)){cur++;x=addDay(x,-1)}const arr=[...d].sort();let best=0,run=0,prev=null;arr.forEach(k=>{run=(prev&&addDay(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k});return{cur,best,month:arr.filter(k=>k.startsWith(td.slice(0,7))).length}}
function studyTodaySec(){const td=jst();return(S.study.log||[]).filter(x=>x.d===td).reduce((a,x)=>a+x.sec,0)+vTdy().sec}
function vShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function vKeep(){const g=id=>{const e=document.getElementById(id);return e?e.value:null};[['vq','q'],['va','a'],['vc','c'],['vbulk','bulk'],['vdn','dn']].forEach(x=>{const v=g(x[0]);if(v!==null)vDr[x[1]]=v})}

function vNewCard(q,a,c){return{id:'c'+Date.now()+Math.random().toString(36).slice(2,5),q,a,cat:c||'',st:'new',ok:0,ng:0,last:null,t:Date.now()}}
function vAddCard(){vKeep();const d=vDeck();if(!d)return toast('先に単語帳を作ってください');const q=vDr.q.trim(),a=vDr.a.trim();if(!q||!a)return toast('問題と答えを入力してください');d.cards.push(vNewCard(q,a,vDr.c.trim()));vDr.q='';vDr.a='';save();render()}
function vBulk(){vKeep();const d=vDeck();if(!d)return toast('先に単語帳を作ってください');let n=0;vDr.bulk.split(/\r?\n/).forEach(line=>{const L=line.trim();if(!L)return;const p=L.split(/\t|,|，|｜|\|/).map(x=>x.trim());if(p.length<2||!p[0]||!p[1])return;d.cards.push(vNewCard(p[0],p[1],p[2]||''));n++});if(!n)return toast('「問題,答え」の形で、1行ずつ入力してください');vDr.bulk='';save();toast(n+'枚を追加しました');render()}

function vTime(){const s=vSess;if(!s)return;const n=Date.now(),v=vS();if(s.act&&n-s.act<=90000){const dt=Math.floor((n-s.act)/1000),dy=vTodayRef();v.sec+=dt;dy.sec+=dt}s.act=n}

function vRecord(c,ok){const s=vSess,v=vS(),td=jst(),dy=vTodayRef();c.seen=(c.seen||0)+1;if(ok){c.ok++;c.st='known';c.last=true;s.okN++;dy.ok++}else{c.ng++;c.st='unknown';c.last=false;s.ngN++;dy.ng++}

 '<button class="gg-metric" onclick="go(\'study\')"><span class="mut">勉強</span><b>'+study+'<small> 分</small></b><span class="mut">記録する ›</span></button>'+

 '<section class="gg-section"><div class="sec-head"><h2>今日のタスク</h2><div class="row" style="gap:6px;align-items:center"><span class="mut">未完了 '+left+' 件</span><button class="tiny" onclick="ordMode=!ordMode;render()">'+(ordMode?'並び替え終了':'並び替え')+'</button></div></div>'+
 evToday()+'<div class="gg-filters">'+[['today','今日'],['all','すべて'],['done','完了済み']].map(x=>'<button class="sm '+(filter===x[0]?'on':'ghost')+'" onclick="filter=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>'+
 '<div class="gg-list">'+(ts.length?ts.map((t,i)=>taskRow(t,ordMode?ordCtl(t,ts[i-1],ts[i+1]):'')).join(''):'<div class="empty">タスクはありません。＋ から追加できます。</div>')+'</div>'+
 (all.length?'<div class="mut" style="margin-top:8px">今日の進捗 '+dn+' / '+all.length+'</div><div class="bar" style="margin-top:4px"><i style="width:'+(dn/all.length*100)+'%"></i></div>':'')+overdueHint()+'</section>'+
 '<section class="gg-section"><div class="sec-head"><h2>課題</h2><span class="mut">未提出 '+assignOpen.length+' 件</span></div><div class="gg-list">'+(assignOpen.length?assignOpen.map(a=>aRow(a)).join(''):'<div class="empty">未提出の課題はありません。</div>')+(assignDone.length?assignDone.map(a=>aRow(a)).join(''):'')+'</div><button class="gg-link" onclick="go(\'cal\')">カレンダーで予定を確認　›</button></section>'+
 
 '<button class="verse gg-verse" onclick="readVerse('+vi+')"><span>✦</span><span><b>今日の聖句</b><span class="mut">　'+esc(VERSES[vi].r)+'</span></span><span class="mut">›</span></button>';
}
function vCard(i){
 const v=VERSES[i],f=S.favs.includes(i);
 return '<details class="gg-verse-detail"><summary><span class="tag">'+esc(CATS[v.c]||'')+'</span>　<b>'+esc(v.r)+'</b>'+(v.tr?' <span class="mut">（'+esc(v.tr)+'）</span>':'')+'</summary><div class="gg-verse-body">'+(v.text?'<p>'+esc(v.text)+'</p>':'<p class="mut">本文は未登録です。「編集」から、お手持ちの聖書の本文を入れられます。</p>')+(v.s?'<p class="mut">'+esc(v.s)+'</p>':'')+'<div class="row"><button class="'+(f?'on':'ghost')+' sm" onclick="fav('+i+')">'+(f?'★':'☆')+' お気に入り</button><button class="ghost sm" onclick="vForm('+i+')">編集</button><button class="ghost sm" onclick="vDel('+i+')">削除</button></div></div></details>';
}
function vMore(){
 return '<h1>その他</h1><div class="gg-more-list">'+
 [['water','◇','水分','水分量と直近7日の記録'],['med','◌','瞑想','記録・呼吸法・継続状況'],['hab','◐','ルーティン','毎日の習慣とルール'],['verse','✦','聖句の書庫','聖句の検索・お気に入り・編集'],['ref','▧','一日の振り返り','日ごとのタスクとメモ'],['settings','⚙','設定','テーマ・データ管理・通知']].map(x=>'<button class="gg-more-row" onclick="go(\''+x[0]+'\')"><span class="gg-more-ic">'+x[1]+'</span><span class="gg-more-txt"><b>'+x[2]+'</b><small>'+x[3]+'</small></span><span class="mut">›</span></button>').join('')+
 '</div>';
}
function ggOpenAdd(kind){
 const ov=document.getElementById('gg-add-overlay'),sh=document.getElementById('gg-add-sheet');
 if(!ov||!sh)return;
 ggAddKind=kind||'task';ggRenderAdd();ov.classList.add('open');sh.classList.add('open');document.body.style.overflow='hidden';
}
function ggCloseAdd(){
 const ov=document.getElementById('gg-add-overlay'),sh=document.getElementById('gg-add-sheet');
 if(ov)ov.classList.remove('open');if(sh)sh.classList.remove('open');document.body.style.overflow='';
}
let ggAddKind='task';
function ggRenderAdd(){
 const sh=document.getElementById('gg-add-sheet');if(!sh)return;
 const k=ggAddKind,tab=(v,l)=>'<button class="'+(k===v?'on':'')+'" onclick="ggAddKind=\''+v+'\';ggRenderAdd()">'+l+'</button>';
 const date=(view==='cal'&&cD)?cD:jst();
 let fields='';
 if(k==='task')fields='<input id="gg-name" placeholder="タスク名" maxlength="120"><input id="gg-date" type="date" value="'+date+'"><input id="gg-time" type="time"><input id="gg-memo" placeholder="メモ（任意）"><select id="gg-repeat"><option value="none">くりかえしなし</option><option value="daily">毎日</option><option value="weekdays">平日</option><option value="weekly">毎週</option></select>';
 if(k==='assign')fields='<input id="gg-name" placeholder="課題名" maxlength="120"><input id="gg-date" type="date" value="'+date+'"><input id="gg-time" type="time"><input id="gg-memo" placeholder="メモ（任意）">';
 if(k==='event')fields='<input id="gg-name" placeholder="予定名" maxlength="120"><input id="gg-date" type="date" value="'+date+'"><input id="gg-time" type="time"><input id="gg-end" type="date" aria-label="終了日（任意）"><input id="gg-memo" placeholder="メモ（任意）">';
 sh.innerHTML='<h3>追加する</h3><div class="gg-tabs">'+tab('task','タスク')+tab('assign','課題')+tab('event','予定')+'</div><div class="gg-fields">'+fields+'</div><button class="gg-submit" onclick="ggSubmitAdd()">追加する</button><button class="gg-cancel" onclick="ggCloseAdd()">キャンセル</button>';
 const e=document.getElementById('gg-name');if(e)e.focus({preventScroll:true});
}
function ggSubmitAdd(){
 const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
 const n=val('gg-name'),d=val('gg-date')||jst(),tm=val('gg-time'),memo=val('gg-memo');
 if(!n)return toast('名前を入力してください');
 if(ggAddKind==='task'){
  const rep=val('gg-repeat')||'none';
  if(rep!=='none'){const wd=new Date(d+'T00:00:00Z').getUTCDay();S.recur.push({id:'r'+Date.now(),name:n,memo,tm,rep,jc:false,wd,start:d,last:''})}
  else S.tasks.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,5),name:n,memo,tm,jc:false,date:d,created:Date.now(),done:false,doneAt:null,doneDate:null});
 }else if(ggAddKind==='assign'){
  S.assign.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,5),name:n,due:d,at:tm,memo,done:false,doneDate:null,created:Date.now()});
 }else{
  const end=val('gg-end');if(end&&end<d)return toast('終了日は開始日より後にしてください');
  (S.events=S.events||[]).push({id:'e'+Date.now()+Math.random().toString(36).slice(2,4),date:d,tm,te:'',jc:false,end:end&&end>d?end:'',name:n,memo});
 }
 save();ggCloseAdd();render();toast('追加しました');
}
function ggEnhanceListMenus(){
 document.querySelectorAll('#app .sw').forEach(row=>{
  if(row.querySelector('.gg-list-menu'))return;
  const actions=row.querySelector('.acts');if(!actions)return;
  const b=document.createElement('button');b.type='button';b.className='gg-list-menu';b.textContent='⋯';b.setAttribute('aria-label','項目の操作');
  b.onclick=()=>row.classList.toggle('gg-actions-open');
  row.appendChild(b);
 });
}
function ggEnsureControls(){
 let fab=document.getElementById('gg-fab');
 if(!fab){fab=document.createElement('button');fab.id='gg-fab';fab.type='button';fab.setAttribute('aria-label','追加');fab.textContent='＋';fab.onclick=()=>ggOpenAdd('task');document.body.appendChild(fab)}
 let ov=document.getElementById('gg-add-overlay');
 if(!ov){ov=document.createElement('div');ov.id='gg-add-overlay';ov.onclick=ggCloseAdd;document.body.appendChild(ov)}
 let sh=document.getElementById('gg-add-sheet');
 if(!sh){sh=document.createElement('div');sh.id='gg-add-sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-label','追加');document.body.appendChild(sh)}
 const active=['home','cal'].includes(view);
 fab.style.display=active?'block':'none';
}
const _ggRender=render;
render=function(){_ggRender.apply(this,arguments);ggEnsureControls();ggEnhanceListMenus();
 const nav=document.getElementById('nav');
 if(nav){const tabs=[['home','☾','ホーム'],['cal','▦','カレンダー'],['study','▤','勉強'],['set','•••','その他']];
 nav.innerHTML=tabs.map(n=>'<button class="'+((view===n[0]||(n[0]==='set'&&['set','settings','water','med','verse','ref','hab'].includes(view)))?'on':'')+'" onclick="go(\''+n[0]+'\')"><div>'+n[1]+'</div>'+n[2]+'</button>').join('')}
};

function navCard(){return '<div class="card"><h3>下部ナビゲーション</h3><p class="mut" style="margin:0">ホーム・カレンダー・勉強・その他の4項目で固定しています。</p></div>'}
const _ggCal=vCal;vCal=function(){const f=calForm();return _ggCal().replace(f,'')};
say('open');render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
