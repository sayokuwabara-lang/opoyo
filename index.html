<style>
:root{--bg:#E2E2E3;--card:#F3F3F3;--sub:#D3D3D3;--tx:#2B2B2D;--tx2:#5F6062;--ac:#6D6E70;--ac2:#AAAAAB;--bd:#C2C2C3;--ink:#2A2326;--pg:#555556;--inp:#fff;--h1:#AAAAAB;--h2:#6D6E70;--h3:#3a3a3c;--ph1:#6D6E70;--ph2:#AAAAAB;--ph3:#3a3a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#1b1b1d;--card:#262629;--sub:#35353a;--tx:#e9e9ec;--tx2:#a2a2aa;--ac:#5f5f68;--ac2:#6b6b74;--bd:#3f3f45;--ink:#e9e9ec;--pg:#7b7b86;--inp:#1f1f22;--h1:#4a4a52;--h2:#6a6a73;--h3:#8a8a94;--ph1:#8a8a94;--ph2:#5a5a62;--ph3:#d4d4dc;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.8 "Noto Sans JP","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",sans-serif;font-weight:500;overflow-x:hidden;overscroll-behavior-y:none}
h1,h2,h3{font-weight:700;margin:0 0 8px;letter-spacing:.03em}
h1{font-size:22px;text-align:center}h2{font-size:19px}h3{font-size:17px}
#app{max-width:520px;margin:0 auto;padding:14px 14px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,40,45,.06)}
.card.deco{border-top:3px solid var(--ac2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mut{color:var(--tx2);font-size:15px}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
button.sm{min-height:38px;padding:4px 10px;font-size:15px}
button.on{background:var(--pg);border-color:var(--pg);color:#fff}
input,textarea,select{font:inherit;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--inp);color:var(--tx)}
.bar{height:12px;background:var(--sub);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pg);transition:width .4s}
.bub{background:var(--sub);border-radius:14px;padding:10px 14px}
.bub.t{position:relative;flex:1}.bub.t:before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-left:0;border-right-color:var(--sub)}
.jace{background:none;border:0;padding:0;min-height:0;display:block;margin:0 auto}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.task:first-of-type{border-top:0}
.chk{width:24px;height:24px;min-width:24px;min-height:24px;margin-top:5px;border-radius:50%;padding:0;background:transparent;border:2px solid var(--ac);color:#fff;font-size:13px;line-height:1}
.chk.d{background:var(--pg);border-color:var(--pg)}
.done .tt{text-decoration:line-through;color:var(--tx2)}
nav{position:fixed;left:0;right:0;bottom:0;transform:translateZ(0);-webkit-transform:translateZ(0);background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:transparent;color:var(--tx2);border:0;border-radius:0;font-size:11px;min-height:56px;padding:4px 0;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:9;max-width:88%;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.s{opacity:1}
.tag{display:inline-block;background:var(--sub);border-radius:10px;padding:0 8px;font-size:13px}
.sw{position:relative;overflow:hidden;border-top:1px solid var(--bd)}.sw .task{border-top:0}.acts{position:absolute;right:0;top:0;bottom:0;display:flex}.acts button{min-height:0;height:100%;width:72px;border-radius:0;border:0;padding:0}.acts button.ghost{background:var(--sub);color:var(--tx)}.acts button.del{background:#6b4a4f}.swi{position:relative;background:var(--card);transition:transform .2s;touch-action:pan-y;user-select:none;-webkit-user-select:none}.ov{position:fixed;inset:0;background:rgba(30,30,34,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.mb{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px}
input[type=date],input[type=time]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}.bub.red{background:#B5474E;color:#fff}.bub.t.red:before{border-right-color:#B5474E}
.mb{max-height:88vh;overflow:auto}
.cp{min-height:34px;padding:3px 8px;font-size:14px;border-radius:10px}
.tiny{min-height:0;padding:2px 10px;font-size:12px;background:transparent;color:var(--tx2);border:1px solid var(--bd);border-radius:8px}
.big{font-size:46px;text-align:center;letter-spacing:.08em;font-weight:700}
/* ---- ジェイスの部屋・隠れ家 ---- */
.room{display:block;width:100%;height:auto;border-radius:14px}
.room .r-lt{pointer-events:none}
.room .w-breathe{animation:wB 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.room .w-tail{animation:wT 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
.room .w-z{animation:wZ 4s ease-in-out infinite}
.room .fl{animation:wF 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.room .lt{animation:wL 3.4s ease-in-out infinite}
.room.listen .w-earL{transform:rotate(-9deg);transform-box:fill-box;transform-origin:50% 100%}
.room.listen .w-earR{transform:rotate(9deg);transform-box:fill-box;transform-origin:50% 100%}
@keyframes wH{0%,100%{transform:rotate(0)}30%{transform:rotate(2.2deg) translateY(1px)}62%{transform:rotate(-2deg)}}
.room .w-hw{animation:wH 9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wB{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes wT{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes wZ{50%{transform:translate(4px,-6px)}}
@keyframes wF{0%,100%{transform:scale(1,.94)}40%{transform:scale(1.06,1.1)}70%{transform:scale(.96,.98)}}
@keyframes wL{0%,100%{opacity:.85}35%{opacity:1}60%{opacity:.7}}
.dn2{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;background:radial-gradient(120% 80% at 50% 0%,#141c34 0%,#0a0f1c 70%);color:#c8ccd4;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
.dn2 *{box-sizing:border-box}

.dn2-b.on{background:rgba(224,160,80,.2);border-color:rgba(224,160,80,.55);color:#f3d9ac}
.dn2-stage{flex:none;width:100%;max-width:560px;margin:0 auto;padding:0 8px}
.dn2-text{min-height:4.2em;padding:12px 24px 2px;text-align:center;font-size:17px;line-height:1.9;color:#dadde4;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity 1.2s}
.dn2-sub{padding:0 24px;text-align:center;font-size:12.5px;line-height:1.7;color:#aab0bc}
.dn2-bot{margin-top:auto;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.dn2-in{display:flex;gap:8px;margin-top:8px}
.dn2-in input{flex:1;min-width:0;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid rgba(200,204,212,.28);background:rgba(14,20,36,.7);color:#e4e6ec;font:inherit;font-size:16px}
.dn2-in input::placeholder{color:#7d8496}
.dn2-sheet{position:absolute;left:12px;right:12px;top:58px;bottom:84px;overflow:auto;padding:12px 14px;border-radius:18px;background:rgba(10,14,28,.95);border:1px solid rgba(200,204,212,.18);display:none}
.dn2-sheet.on{display:block}
.dn2-sheet h4{margin:12px 0 6px;font-size:13px;color:#aab0bc;font-weight:500}
.dn2-sheet h4:first-child{margin-top:0}
.dn2-row{display:flex;flex-wrap:wrap;gap:6px}
.dn2-breath{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(6,9,18,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.dn2-breath.on{display:flex}
.dn2-bc{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(224,160,80,.6),rgba(224,160,80,.14) 62%,rgba(224,160,80,0));transform:scale(.55)}
.dn2-bl{font-size:20px;letter-spacing:.2em;color:#e8c98f}
.rm-chip{font:inherit;font-size:13px;min-height:32px;padding:3px 11px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.rm-chip.on{background:var(--pg);border-color:var(--pg);color:#fff}
.dn2-sheet .rm-chip{border-color:rgba(200,204,212,.28);color:#c8ccd4}
.dn2-sheet .rm-chip.on{background:rgba(224,160,80,.22);border-color:rgba(224,160,80,.55);color:#f3d9ac}
</style></head><body>

<script>
const KEY='grimoire_garden_v1';
const SAY={
open:['来たか。無理のない範囲で、少しずつ進めよう。','おかえり。今日も静かに始めればいい。','よく来たな。ゆっくりでいい。'],
done:['一つ片づいたな。少しずつ進めばいい。','よくやった。その一歩は、ちゃんと残る。','終わったか。ひと息ついていい。'],
left:['残ったものは、明日に回してもいい。全部を一度に抱える必要はない。'],
ref:['今日を振り返れたなら、それで十分だ。休むのも大事な一日だ。'],
ms:['少し休もう。今は、何かを成し遂げなくてもいい。'],
me:['おかえり。少しでも落ち着けたなら、それで十分だ。']};
const WORDS=['全部やらなくていい。今日の一つで十分だ。','疲れたなら、先に休め。勉強は逃げない。','うまくいかない日は、続けた日でもある。','小さく始めれば、案外動き出す。','比べるのは昨日の自分だけでいい。','わからないのは、前に進んでいる証拠だ。','深呼吸を一つ。それだけで違う。','終わらせるより、手をつけることを大事にしよう。','休んだことは、失敗じゃない。','今日の自分に、できる分だけ頼めばいい。','机に向かえた。それだけで一歩だ。','焦る夜は、まず水を飲め。'];
const DEFM=[
{id:'m1',n:'月影の呼吸',min:5,g:'気持ちを落ち着ける',d:'呼吸を無理に変えず、自然な呼吸に注意を向けます。'},
{id:'m2',n:'書庫の静寂',min:5,g:'頭の中を整理する',d:'浮かんだ考えに気づき、追い払わず、再び目の前の感覚に注意を戻します。'},
{id:'m3',n:'夜の手放し',min:7,g:'一日の緊張を整理する',d:'今日あったことを思い浮かべ、今すぐ解決しなくてよいことを一度脇に置きます。'},
{id:'m4',n:'足元の休息',min:5,g:'授業の合間や電車で休む',d:'足が床に触れる感覚、手の感覚、周囲の音に注意を向けます。'}];
let MEDS=DEFM.slice();
const DEFMOOD=[['疲れている','m4'],['不安がある','m1'],['頭が散らかっている','m2'],['一日を終えたい','m3']];
let MOODS=DEFMOOD.map(x=>x.slice());
const DEFC=['疲れたとき・休みたいとき','不安や心配があるとき','勇気が必要なとき','希望を持ちたいとき','勉強や判断に知恵が必要なとき','自分を責めてしまうとき','眠る前・静かな時間','感謝や喜びを感じたいとき'];
let CATS=DEFC.slice();
// s は本文の引用ではなく、内容の短い要約。本文は利用条件を確認した翻訳のみ別途追加する
const DEFV=[
{c:0,r:'マタイによる福音書 11:28',s:'疲れた人、重荷を負う人に向けて、休ませてあげようと呼びかける言葉だ。'},
{c:0,r:'詩編 23:1–3',s:'羊飼いに導かれ、静かな水辺で魂が元気を取り戻す情景を歌っている。'},
{c:1,r:'マタイによる福音書 6:34',s:'明日のことまで思い悩むな、という教えだ。今日の分だけ見ればいい。'},
{c:1,r:'フィリピの信徒への手紙 4:6–7',s:'何も思い煩わず、願いを祈りで伝えれば、心に平安が与えられると語る。'},
{c:2,r:'イザヤ書 41:10',s:'恐れるな、わたしが共にいる、という励ましの言葉だ。'},
{c:2,r:'ヨシュア記 1:9',s:'強く、勇気を持て。どこへ行っても共にいる、という約束だ。'},
{c:3,r:'哀歌 3:22–23',s:'慈しみは尽きず、朝ごとに新しくされる、と語る。昨日がどうでも、今日は新しい。'},
{c:3,r:'ローマの信徒への手紙 8:28',s:'すべてのことが、最終的には益になるよう働くという希望を語る。'},
{c:4,r:'箴言 2:6',s:'知恵は与えられるものだ、と語る。知ることは贈り物でもある。'},
{c:4,r:'ヤコブの手紙 1:5',s:'知恵に欠けるなら、求めればよい。ためらわず頼っていい、という言葉だ。'},
{c:5,r:'詩編 34:18',s:'心の砕けた人のそばに寄り添う、という言葉だ。落ち込む日も一人ではない。'},
{c:5,r:'ローマの信徒への手紙 8:38–39',s:'どんなものも、神の愛から自分を引き離せないと語る。失敗しても変わらない。'},
{c:6,r:'詩編 4:8',s:'安らかに横になり、眠れる、という夜の祈りの言葉だ。'},
{c:6,r:'詩編 121:7–8',s:'出入りのすべてを見守ってくれる、という守りの約束を歌う。'},
{c:7,r:'詩編 118:24',s:'今日という日を喜び祝おう、という呼びかけだ。'},
{c:7,r:'テサロニケの信徒への手紙一 5:16–18',s:'いつも喜び、絶えず祈り、どんなことにも感謝する、という勧めだ。'}];
let VERSES=[];function syncV(){if(!Array.isArray(S.verses)||!S.verses.length){S.verses=DEFV.map((v,i)=>({c:v.c,r:v.r,s:v.s,text:(S.vtext&&S.vtext[i])||'',tr:''}));save()}VERSES=S.verses;if(!S.water)S.water={goal:2000,log:{}};if(S.water.goal<100)S.water.goal=2000;if(!Array.isArray(S.water.presets))S.water.presets=[100,200,300,500];S.study=Object.assign({subs:['国語','数学','英語'],log:[],pw:25,pb:5,tm:30},S.study||{});if(!Array.isArray(S.medC))S.medC=[];MEDS=DEFM.concat(S.medC,EXTRA);if(!Array.isArray(S.cats)||!S.cats.length)S.cats=DEFC.slice();CATS=S.cats;if(!Array.isArray(S.moods)||!S.moods.length)S.moods=DEFMOOD.map(x=>x.slice());MOODS=S.moods;S.nav=(Array.isArray(S.nav)?S.nav:[]).filter(k=>TABS.some(t=>t[0]===k));TABS.forEach(t=>{if(!S.nav.includes(t[0]))S.nav.push(t[0])})}

const jst=(t=Date.now())=>new Date(t+9*36e5).toISOString().slice(0,10);
const addDay=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function fresh(){return{v:2,tasks:[],assign:[],recur:[],water:{goal:8,int:2,log:{}},refl:{},meds:[],favs:[],vhist:{},vtext:{}}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(fresh(),JSON.parse(r),{v:2})}catch(e){}return fresh()}
let S=load(),view='home',filter='today',rd=jst(),vcat=-1,vq='',saying='',last={},tm=null,mood=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存に失敗しました。ブラウザの保存設定を確認してください')}}
function toast(m){const t=$('toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}
function pick(k,a){let c=a.filter(x=>x!==last[k]);c=c.length?c:a;const s=c[Math.floor(Math.random()*c.length)];last[k]=s;return s}
function say(k){sref='';sayMode='word';return saying=pick(k,SAY[k])}
function hash(d){let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;return h}
function talk(){sref='';saying=pick('w',WORDS);render()}
function readVerse(i){const v=VERSES[i];saying=v.r+'。'+v.s+(S.vtext[i]?'':'　本文は、お手持ちの聖書で読んでみてくれ。');render()}

function jace(){const F='#4a4852',O='#2a2326',C='#e6dccd',P='#f0a79a',st=' stroke="'+O+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
return '<svg viewBox="0 -4 200 200" width="170" height="170" role="img" aria-label="ジェイス" style="display:block">'+
'<path d="M140 168 Q186 160 178 108 Q160 116 146 140Z" fill="'+F+'"'+st+'/><path d="M178 108 Q174 132 158 140 Q170 126 178 108Z" fill="'+C+'"/>'+
'<path d="M64 120 Q58 170 68 186 L132 186 Q142 170 136 120Z" fill="'+F+'"'+st+'/><path d="M82 120 L92 146 L100 138 L108 146 L118 120Z" fill="'+C+'"/>'+
'<ellipse cx="76" cy="184" rx="18" ry="11" fill="'+C+'"'+st+'/><ellipse cx="124" cy="184" rx="18" ry="11" fill="'+C+'"'+st+'/>'+
'<path d="M44 72 L36 14 L88 48Z" fill="'+F+'"'+st+'/><path d="M156 72 L164 14 L112 48Z" fill="'+F+'"'+st+'/><path d="M49 58 L46 28 L70 46Z" fill="'+P+'"/><path d="M151 58 L154 28 L130 46Z" fill="'+P+'"/>'+
'<path d="M30 92 Q28 40 100 40 Q172 40 170 92 Q172 126 100 132 Q28 126 30 92Z" fill="'+F+'"'+st+'/>'+
'<path d="M50 102 Q58 84 84 92 Q100 97 116 92 Q142 84 150 102 Q146 126 100 130 Q54 126 50 102Z" fill="'+C+'"/><ellipse cx="72" cy="72" rx="11" ry="5" fill="'+C+'"/><ellipse cx="128" cy="72" rx="11" ry="5" fill="'+C+'"/>'+
'<ellipse cx="62" cy="106" rx="9" ry="6" fill="'+P+'"/><ellipse cx="138" cy="106" rx="9" ry="6" fill="'+P+'"/>'+
'<ellipse cx="76" cy="88" rx="9" ry="11" fill="'+O+'"/><ellipse cx="124" cy="88" rx="9" ry="11" fill="'+O+'"/><circle cx="79" cy="84" r="3.2" fill="#fff"/><circle cx="127" cy="84" r="3.2" fill="#fff"/><circle cx="73" cy="93" r="1.5" fill="#fff"/><circle cx="121" cy="93" r="1.5" fill="#fff"/>'+
'<ellipse cx="100" cy="102" rx="8" ry="6" fill="'+O+'"/><path d="M88 110 Q94 118 100 111 Q106 118 112 110" fill="none" stroke="'+O+'" stroke-width="3" stroke-linecap="round"/></svg>'}

function toggle(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
if(!t.done){t.done=true;t.doneAt=Date.now();t.doneDate=jst();say('done');toast('完了しました')}

function almStart(sec){almStop();try{const sr=8000,ch=chimeBytes(sr),n=Math.floor(sr*sec),len=n+ch.length,b=new Uint8Array(44+len),dv=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};w(0,'RIFF');dv.setUint32(4,36+len,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,len,true);b.fill(128,44,44+n);b.set(ch,44+n);alm=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));alm.play().catch(()=>{alm=null})}catch(e){alm=null}}

const WEAK_MIN=5;
const VL={
open:['今日は何を覚えるんだ？','急がなくていい。ひとつずつ確認していこう。','無理に全部覚えようとするな。まずは始めてみろ。','さて、今日はどこまで進めるかな。'],

let vCur='',vSess=null,vDr={q:'',a:'',c:'',bulk:'',dn:''},stTab='rec',stLine='';
function vS(){const v=S.vocab=S.vocab||{};if(!v.decks)v.decks=[];if(v.sec==null)v.sec=0;if(!v.days)v.days=[];if(!v.day)v.day={};if(!v.cfg)v.cfg={filter:'all',order:'random',side:'q',tmode:'type',cat:''};return v}
function vDeck(){const v=vS();let d=v.decks.find(x=>x.id===vCur);if(!d){d=v.decks[0]||null;vCur=d?d.id:''}return d}
function vcGet(id){const d=vDeck();return d?d.cards.find(c=>c.id===id):null}
function isWeak(c){return c.st==='unknown'||c.ng>=2||(c.ok+c.ng>=3&&c.ok/(c.ok+c.ng)<0.6)}
function vAll(){return vS().decks.reduce((a,d)=>a.concat(d.cards),[])}
function vAcc(cards){const o=cards.reduce((a,c)=>a+c.ok,0),n=cards.reduce((a,c)=>a+c.ng,0);return o+n?Math.round(o/(o+n)*100):null}
function vTdy(){const v=vS(),td=jst();return v.day[td]||{ids:[],ok:0,ng:0,sec:0}}
function vStreak(){const v=vS(),d=new Set(v.days),td=jst();let cur=0,x=d.has(td)?td:addDay(td,-1);while(d.has(x)){cur++;x=addDay(x,-1)}const arr=[...d].sort();let best=0,run=0,prev=null;arr.forEach(k=>{run=(prev&&addDay(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k});return{cur,best,month:arr.filter(k=>k.startsWith(td.slice(0,7))).length}}
function studyTodaySec(){const td=jst();return(S.study.log||[]).filter(x=>x.d===td).reduce((a,x)=>a+x.sec,0)+vTdy().sec}
function vShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function vKeep(){const g=id=>{const e=document.getElementById(id);return e?e.value:null};[['vq','q'],['va','a'],['vc','c'],['vbulk','bulk'],['vdn','dn']].forEach(x=>{const v=g(x[0]);if(v!==null)vDr[x[1]]=v})}
function vCfg(k,val){vKeep();vS().cfg[k]=val;save();render()}
function vAddDeck(){vKeep();const n=vDr.dn.trim();if(!n)return toast('単語帳の名前を入力してください');const d={id:'k'+Date.now()+Math.random().toString(36).slice(2,4),name:n,cards:[]};vS().decks.push(d);vCur=d.id;vDr.dn='';save();render()}
function vPickDeck(id){vKeep();vCur=id;vS().cfg.cat='';render()}
function vRenDeck(){const d=vDeck();if(!d)return;modal('<h3>単語帳の名前</h3><input id="vrn" value="'+esc(d.name)+'" style="margin-bottom:10px"><div class="row"><button onclick="vRenSave()">保存</button><button class="ghost" onclick="closeM()">キャンセル</button></div>')}
function vRenSave(){const d=vDeck(),n=$('vrn').value.trim();if(!n)return toast('名前を入力してください');d.name=n;save();closeM();render()}
function vDelDeck(){const d=vDeck();if(!d)return;ask('単語帳「'+esc(d.name)+'」と、中のカード '+d.cards.length+' 枚を削除しますか？','削除する',()=>{const v=vS();v.decks=v.decks.filter(x=>x.id!==d.id);vCur='';save();render()})}
function vNewCard(q,a,c){return{id:'c'+Date.now()+Math.random().toString(36).slice(2,5),q,a,cat:c||'',st:'new',ok:0,ng:0,last:null,t:Date.now()}}
function vAddCard(){vKeep();const d=vDeck();if(!d)return toast('先に単語帳を作ってください');const q=vDr.q.trim(),a=vDr.a.trim();if(!q||!a)return toast('問題と答えを入力してください');d.cards.push(vNewCard(q,a,vDr.c.trim()));vDr.q='';vDr.a='';save();render()}
function vBulk(){vKeep();const d=vDeck();if(!d)return toast('先に単語帳を作ってください');let n=0;vDr.bulk.split(/\r?\n/).forEach(line=>{const L=line.trim();if(!L)return;const p=L.split(/\t|,|，|｜|\|/).map(x=>x.trim());if(p.length<2||!p[0]||!p[1])return;d.cards.push(vNewCard(p[0],p[1],p[2]||''));n++});if(!n)return toast('「問題,答え」の形で、1行ずつ入力してください');vDr.bulk='';save();toast(n+'枚を追加しました');render()}
function vEditCard(id){const c=vcGet(id);if(!c)return;modal('<h3>カードを編集</h3><div class="mut" style="font-size:12px">問題</div><input id="veq" value="'+esc(c.q)+'" style="margin-bottom:6px"><div class="mut" style="font-size:12px">答え</div><input id="vea" value="'+esc(c.a)+'" style="margin-bottom:6px"><div class="mut" style="font-size:12px">カテゴリー</div><input id="vec" value="'+esc(c.cat||'')+'" style="margin-bottom:10px"><div class="row"><button onclick="vEditSave(\''+id+'\')">保存</button><button class="ghost" onclick="closeM()">キャンセル</button></div>')}
function vEditSave(id){const c=vcGet(id),q=$('veq').value.trim(),a=$('vea').value.trim();if(!q||!a)return toast('問題と答えを入力してください');c.q=q;c.a=a;c.cat=$('vec').value.trim();save();closeM();render()}
function vDelCard(id){const c=vcGet(id);if(!c)return;ask('「'+esc(c.q)+'」を削除しますか？','削除する',()=>{const d=vDeck();d.cards=d.cards.filter(x=>x.id!==id);save();render()})}
function vCats(d){return[...new Set((d?d.cards:[]).map(c=>c.cat).filter(Boolean))]}
function vPool(d){const cfg=vS().cfg;let cs=d.cards.filter(c=>!cfg.cat||c.cat===cfg.cat);return{all:cs,unknown:cs.filter(c=>c.st!=='known'),wrong:cs.filter(c=>c.last===false||c.st==='unknown'),weak:cs.filter(isWeak)}}
function vTime(){const s=vSess;if(!s)return;const n=Date.now(),v=vS();if(s.act&&n-s.act<=90000){const dt=Math.floor((n-s.act)/1000),dy=vTodayRef();v.sec+=dt;dy.sec+=dt}s.act=n}
function vTodayRef(){const v=vS(),td=jst();return v.day[td]=v.day[td]||{ids:[],ok:0,ng:0,sec:0}}
function vStart(mode,filter){const d=vDeck();if(!d)return;const v=vS();if(filter)v.cfg.filter=filter;const P=vPool(d)[v.cfg.filter]||[];if(!P.length)return toast('出題できる問題がありません');let ids=P.map(c=>c.id);if(v.cfg.order==='random')vShuffle(ids);
vSess={mode,deck:d.id,ids,i:0,solved:{},n:0,okN:0,ngN:0,flip:false,res:null,opts:null,requeued:{},hist:[],act:Date.now(),line:pick('vo',VL.open),sugg:false,done:false};if(mode==='test'&&v.cfg.tmode==='choice')vMkOpts();save();render()}
function vMkOpts(){const s=vSess,d=vDeck(),c=vcGet(s.ids[s.i]);if(!c){s.opts=null;return}if(vS().cfg.side==='a'){s.opts=null;return}const others=vShuffle([...new Set(d.cards.filter(x=>x.id!==c.id&&x.a!==c.a).map(x=>x.a))]).slice(0,3);if(others.length<3){s.opts=null;return}s.opts=vShuffle(others.concat([c.a]))}
function vRecord(c,ok){const s=vSess,v=vS(),td=jst(),dy=vTodayRef();c.seen=(c.seen||0)+1;if(ok){c.ok++;c.st='known';c.last=true;s.okN++;dy.ok++}else{c.ng++;c.st='unknown';c.last=false;s.ngN++;dy.ng++}
s.hist.push(ok?1:0);let fresh=false;if(!s.solved[c.id]){s.solved[c.id]=1;s.n++;fresh=true}if(dy.ids.indexOf(c.id)<0)dy.ids.push(c.id);
let firstToday=false;if(v.days.indexOf(td)<0){v.days.push(td);firstToday=true}
if(fresh&&s.n%10===0)vEvery(s.n);if(firstToday)vStreakSay();vRoomUnlock();return fresh}
function vEvery(n){const s=vSess,h=s.hist,last=h.slice(-10),prev=h.slice(-20,-10),a=last.reduce((x,y)=>x+y,0)/Math.max(1,last.length),b=prev.length?prev.reduce((x,y)=>x+y,0)/prev.length:null;let t;if(b!=null&&a>=b+0.15)t=pick('vb',VL.better);else if(n>=30&&Math.random()<0.5)t=pick('vl',VL.long);else t=pick('vt',VL.tail);s.line=(n===10?'10問か。':n+'問。')+t;toast(s.line);vWeakCheck()}
function vWeakCheck(){const s=vSess,d=vDeck();if(!s||!d||s.sugg)return;if(d.cards.filter(isWeak).length>=WEAK_MIN){s.sugg=true;s.line=pick('vw',VL.weak)}}
function vStreakSay(){const st=vStreak(),s=vSess;const t=st.cur>=2?(st.cur+'日連続か。'+pick('vsn',VL.streakN)):pick('vs1',VL.streak1);if(s)s.line=t;stLine=t;toast(t)}
function vRoomUnlock(){S.room=S.room||{};const lv=decorLv(),seen=S.room.tier==null?0:S.room.tier;if(lv>seen){S.room.tier=lv;const t=pick('vu',VL.unlock)+'（'+DECOR[lv][2]+'）';stLine=t;toast(t)}else if(S.room.tier==null)S.room.tier=lv}
function vRate(ok){const s=vSess;if(!s||s.done)return;const c=vcGet(s.ids[s.i]);if(!c)return;vTime();vRecord(c,ok);if(!ok&&!s.requeued[c.id]){s.requeued[c.id]=1;s.ids.push(c.id)}vNext()}
function vNext(){const s=vSess;s.i++;s.flip=false;s.res=null;if(s.i>=s.ids.length){vFinish();save();render();return}if(s.mode==='test'&&vS().cfg.tmode==='choice')vMkOpts();else s.opts=null;save();render()}
function vFinish(){const s=vSess;s.done=true;const att=s.okN+s.ngN,acc=att?s.okN/att:0;s.line=pick('ve',acc>=0.8?VL.endHi:acc>=0.5?VL.endMid:VL.endLo);if(vDeck()&&vDeck().cards.filter(isWeak).length>=WEAK_MIN)s.sugg=true}
function vFlip(){if(!vSess)return;vSess.flip=!vSess.flip;render()}
function vSkip(){const s=vSess;if(!s||s.done)return;vTime();s.i++;s.flip=false;s.res=null;if(s.i>=s.ids.length){vFinish()}else if(s.mode==='test'&&vS().cfg.tmode==='choice')vMkOpts();else s.opts=null;render()}
function vNorm(t){return String(t).normalize('NFKC').toLowerCase().replace(/[\s　・、,，.．。!！?？]/g,'')}
function vJudge(c,typed){const forms=[vNorm(c.a)].concat(String(c.a).split(/[／\/;；、,，]/).map(vNorm)).filter(Boolean);return forms.indexOf(vNorm(typed))>=0}
function vSubmit(val){const s=vSess;if(!s||s.done||s.res)return;vTime();const c=vcGet(s.ids[s.i]);if(val==null){const e=document.getElementById('vans');val=e?e.value:''}if(!String(val).trim())return toast('答えを入力してください');const ok=vJudge(c,val);s.res={ok,ans:val};vRecord(c,ok);if(!ok&&!s.requeued[c.id]){s.requeued[c.id]=1;s.ids.push(c.id)}save();render()}
function vChoice(i){const s=vSess;if(!s||!s.opts||s.res)return;vSubmit(s.opts[i])}
function vEnd(){vTime();vSess=null;save();render()}
function vBub(text,extra){return '<div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:14px;margin-bottom:10px"><div style="flex:none">'+jIcon()+'</div><div class="bub t" style="flex:1">'+esc(text)+(extra||'')+'</div></div>'}
function vChips(list,cur,fn){return list.map(x=>'<button class="sm '+(cur===x[0]?'on':'ghost')+'" style="min-height:32px" onclick="'+fn+'(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
function vSetF(k){vCfg('filter',k)}function vSetO(k){vCfg('order',k)}function vSetS(k){vCfg('side',k)}function vSetT(k){vCfg('tmode',k)}function vSetC(k){vCfg('cat',k==='_'?'':k)}
function vSessHtml(){const s=vSess,d=vDeck(),cfg=vS().cfg;if(s.done){const att=s.okN+s.ngN,acc=att?Math.round(s.okN/att*100):0,weak=d?d.cards.filter(isWeak).length:0,wrong=d?d.cards.filter(c=>c.last===false).length:0;
return '<h1>結果</h1>'+vBub(s.line)+'<div class="card"><div class="row" style="gap:10px;flex-wrap:nowrap"><div style="flex:1;text-align:center"><div class="mut">解いた問題</div><div style="font-size:26px;font-weight:700">'+s.n+'</div></div><div style="flex:1;text-align:center"><div class="mut">正答率</div><div style="font-size:26px;font-weight:700">'+acc+'%</div></div><div style="flex:1;text-align:center"><div class="mut">苦手</div><div style="font-size:26px;font-weight:700">'+weak+'</div></div></div></div>'+(s.sugg&&weak>0?'<div class="card"><p style="margin:0 0 8px">苦手な単語が '+weak+' 個あります。</p><button onclick="vStart(\''+s.mode+'\',\'weak\')">苦手だけ復習する</button></div>':'')+'<div class="row"><button onclick="vStart(\''+s.mode+'\')">もう一度</button>'+(wrong?'<button class="ghost" onclick="vStart(\''+s.mode+'\',\'wrong\')">間違えた問題だけ（'+wrong+'）</button>':'')+'<button class="ghost" onclick="vEnd()">閉じる</button></div>'}
const c=vcGet(s.ids[s.i]);if(!c)return '<p class="mut">カードがありません。</p><button onclick="vEnd()">閉じる</button>';const qside=cfg.side==='a'?c.a:c.q,aside=cfg.side==='a'?c.q:c.a;
let body='';if(s.mode==='card'){body='<div class="card" onclick="vFlip()" style="min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer"><div class="mut" style="font-size:12px">'+(s.flip?(cfg.side==='a'?'問題':'答え'):(cfg.side==='a'?'答え':'問題'))+(c.cat?' ・ '+esc(c.cat):'')+'</div><div style="font-size:24px;font-weight:700;margin:8px 0;word-break:break-word">'+esc(s.flip?aside:qside)+'</div><div class="mut" style="font-size:12px">'+(s.flip?'もう一度タップで戻る':'タップして答えを見る')+'</div></div><div class="row" style="margin-top:6px"><button class="ghost" style="flex:1" onclick="vRate(false)">まだ</button><button style="flex:1" onclick="vRate(true)">覚えた</button></div><div style="text-align:center;margin-top:6px"><button class="tiny" onclick="vSkip()">スキップ</button></div>'}
else{const resHtml=s.res?'<div class="bub" style="margin:8px 0;text-align:center"><b style="font-size:18px">'+(s.res.ok?'○ 正解':'× 不正解')+'</b>'+(s.res.ok?'':'<div>答え：'+esc(c.a)+'</div>')+'</div><button style="width:100%" onclick="vNext()">次へ</button>':'';
let inp='';if(!s.res){if(s.opts&&cfg.side!=='a')inp='<div style="display:grid;gap:8px;margin-top:8px">'+s.opts.map((o,i)=>'<button class="ghost" style="text-align:left" onclick="vChoice('+i+')">'+esc(o)+'</button>').join('')+'</div>';else inp='<div class="row" style="flex-wrap:nowrap;margin-top:8px"><input id="vans" placeholder="答えを入力" autocomplete="off" onkeydown="if(event.key===\'Enter\')vSubmit()"><button style="flex:none" onclick="vSubmit()">答える</button></div><div style="text-align:center;margin-top:6px"><button class="tiny" onclick="vSkip()">スキップ</button></div>'}
body='<div class="card" style="min-height:110px;text-align:center"><div class="mut" style="font-size:12px">問題'+(c.cat?' ・ '+esc(c.cat):'')+'</div><div style="font-size:24px;font-weight:700;margin:8px 0;word-break:break-word">'+esc(cfg.side==='a'?c.a:c.q)+'</div></div>'+resHtml+inp}
return '<div class="row sp" style="margin-bottom:6px"><b>'+(s.mode==='card'?'カード':'テスト')+'</b><span class="mut">'+Math.min(s.i+1,s.ids.length)+' / '+s.ids.length+'　解いた '+s.n+'</span><button class="tiny" onclick="vEnd()">終了</button></div><div class="bar" style="margin-bottom:8px"><i style="width:'+Math.min(100,s.i/s.ids.length*100)+'%"></i></div>'+vBub(s.line)+body}
function vHomeHtml(){const v=vS(),d=vDeck(),cfg=v.cfg,td=vTdy();let h='';
h+=vBub(stLine||pick('vo',VL.open),(d&&d.cards.filter(isWeak).length>=WEAK_MIN)?'<div style="margin-top:6px"><button class="sm" onclick="vStart(\'card\',\'weak\')">苦手だけ復習する</button></div>':'');
h+='<div class="card"><div class="row" style="margin-bottom:8px">'+v.decks.map(x=>'<button class="sm '+(d&&d.id===x.id?'on':'ghost')+'" onclick="vPickDeck(\''+x.id+'\')">'+esc(x.name)+'</button>').join('')+'</div><div class="row" style="flex-wrap:nowrap"><input id="vdn" class="cp" placeholder="新しい単語帳の名前" value="'+esc(vDr.dn)+'"><button class="sm" style="flex:none" onclick="vAddDeck()">作成</button></div>'+(d?'<div class="row" style="margin-top:6px;justify-content:flex-end"><button class="tiny" onclick="vRenDeck()">名前を変える</button><button class="tiny" onclick="vDelDeck()">この単語帳を削除</button></div>':'')+'</div>';
if(!d)return h+'<p class="mut">単語帳を作ると、問題と答えを登録できます。外国語、テスト用語、資格の用語など、何でも使えます。</p>';
const P=vPool(d),known=d.cards.filter(c=>c.st==='known').length,acc=vAcc(d.cards),cats=vCats(d);
h+='<div class="card"><div class="row sp"><b>'+esc(d.name)+'</b><span class="mut">'+d.cards.length+'枚</span></div><div class="bar" style="margin:6px 0"><i style="width:'+(d.cards.length?known/d.cards.length*100:0)+'%"></i></div><div class="mut" style="font-size:13px">覚えた '+known+' / '+d.cards.length+'　正答率 '+(acc==null?'—':acc+'%')+'　今日 '+td.ids.length+'問　苦手 '+d.cards.filter(isWeak).length+'</div></div>';
h+='<div class="card"><h3>出題する</h3><div class="mut" style="font-size:12px">出題する問題</div><div class="row" style="margin-bottom:6px">'+vChips([['all','全部 '+P.all.length],['unknown','未暗記 '+P.unknown.length],['wrong','間違えた問題 '+P.wrong.length],['weak','苦手 '+P.weak.length]],cfg.filter,'vSetF')+'</div>'+(cats.length?'<div class="mut" style="font-size:12px">カテゴリー</div><div class="row" style="margin-bottom:6px">'+vChips([['_','すべて']].concat(cats.map(c=>[c,c])),cfg.cat||'_','vSetC')+'</div>':'')+
'<div class="row" style="margin-bottom:6px">'+vChips([['random','ランダム'],['seq','順番どおり']],cfg.order,'vSetO')+'<span style="width:6px"></span>'+vChips([['q','問題から'],['a','答えから']],cfg.side,'vSetS')+'</div><div class="row" style="margin-bottom:8px"><span class="mut" style="font-size:12px">テスト形式</span>'+vChips([['type','入力'],['choice','4択']],cfg.tmode,'vSetT')+'</div><div class="row"><button style="flex:1" onclick="vStart(\'card\')">カードで覚える</button><button style="flex:1" onclick="vStart(\'test\')">テスト</button></div></div>';
h+='<div class="card"><h3>カードを追加</h3><input id="vq" class="cp" placeholder="問題（単語）" value="'+esc(vDr.q)+'" style="margin-bottom:4px"><input id="va" class="cp" placeholder="答え（意味）。複数ある答えは「／」で区切る" value="'+esc(vDr.a)+'" style="margin-bottom:4px"><div class="row" style="flex-wrap:nowrap"><input id="vc" class="cp" list="vcl" placeholder="カテゴリー（任意）" value="'+esc(vDr.c)+'"><datalist id="vcl">'+cats.map(c=>'<option value="'+esc(c)+'"></option>').join('')+'</datalist><button class="sm" style="flex:none" onclick="vAddCard()">追加</button></div><h3 style="font-size:14px;margin-top:12px">まとめて追加</h3><textarea id="vbulk" rows="3" placeholder="1行に1枚。「問題,答え」または「問題,答え,カテゴリー」" style="min-height:0">'+esc(vDr.bulk)+'</textarea><button class="ghost sm" style="margin-top:6px" onclick="vBulk()">まとめて追加</button></div>';
const list=d.cards.filter(c=>!cfg.cat||c.cat===cfg.cat);
h+='<div class="card"><h3>カード一覧</h3>'+(list.length?list.slice(0,60).map(c=>{const a=c.ok+c.ng?Math.round(c.ok/(c.ok+c.ng)*100)+'%':'—';return '<div class="sw"><div class="acts"><button class="ghost" onclick="vEditCard(\''+c.id+'\')">編集</button><button class="del" onclick="vDelCard(\''+c.id+'\')">削除</button></div><div class="swi task"><span style="flex:none;width:18px;color:var(--pg)">'+(c.st==='known'?'●':c.st==='unknown'?'○':'·')+'</span><div style="flex:1;min-width:0"><div class="tt">'+esc(c.q)+' <span class="mut">→ '+esc(c.a)+'</span></div><div class="mut" style="font-size:12px">'+(c.cat?esc(c.cat)+'　':'')+'正答率 '+a+(isWeak(c)?'　苦手':'')+'</div></div></div></div>'}).join('')+(list.length>60?'<p class="mut" style="font-size:12px">ほか '+(list.length-60)+'枚</p>':'')+'<p class="mut" style="font-size:12px;margin:4px 0 0">● 覚えた　○ まだ　· 未挑戦　／ ← 左にスライドで編集・削除</p>':'<p class="mut">カードがありません。</p>')+'</div>';
return h}
function vRoomHtml(){const m=totalMin(),st=vStreak(),td=vTdy(),all=vAll(),lv=decorLv(),nx=decorNext(),o=roomOpt(),on=ambS().on&&!ambS().mute,nd=studyDays();
const stat=(k,x)=>'<div style="flex:1;min-width:46%;padding:6px 4px;border-top:1px solid var(--bd)"><div class="mut" style="font-size:12px">'+k+'</div><div style="font-size:19px;font-weight:700">'+x+'</div></div>';
let svg=roomSvg(o,{pose:RM.pose,eye:RM.eye},lv,'').replace('</svg>','<rect x="60" y="30" width="240" height="262" fill="transparent" style="touch-action:pan-y;cursor:pointer" onpointerdown="rmPet()" onpointermove="rmStroke(event)"/></svg>');
return vBub(stLine||pick('vr',VL.room))+'<div class="card" style="padding:8px">'+svg+'<div class="row" style="margin-top:8px"><button class="sm" onclick="denOpen()">隠れ家に入る</button><button class="sm '+(on?'on':'ghost')+'" onclick="ambToggle(\'on\')">環境音 '+(on?'ON':'OFF')+'</button></div></div>'+
'<div class="card"><h3>STUDY STREAK</h3><div class="row" style="flex-wrap:nowrap;gap:8px;text-align:center"><div style="flex:1"><div class="mut" style="font-size:12px">現在の連続学習日数</div><div style="font-size:26px;font-weight:700">'+st.cur+'日</div></div><div style="flex:1"><div class="mut" style="font-size:12px">最長</div><div style="font-size:26px;font-weight:700">'+st.best+'日</div></div><div style="flex:1"><div class="mut" style="font-size:12px">今月</div><div style="font-size:26px;font-weight:700">'+st.month+'日</div></div></div><p class="mut" style="font-size:12px;margin:6px 0 0">1日に1問以上解くと、学習した日として数えます（日本時間）。</p></div>'+
'<div class="card"><h3>学習状況</h3><div class="row" style="gap:0">'+stat('今日解いた問題数',td.ids.length+'問')+stat('今日の学習時間',hm(studyTodaySec()))+stat('累計学習時間',hm(m*60))+stat('連続学習日数',st.cur+'日')+stat('最長連続学習日数',st.best+'日')+stat('暗記済みの単語',all.filter(c=>c.st==='known').length+'語')+stat('苦手な単語',all.filter(isWeak).length+'語')+stat('今月の学習日数',st.month+'日')+'</div></div>'+
'<div class="card"><h3>部屋の飾り</h3><p class="mut" style="font-size:13px;margin:0 0 6px">記録をつけた日が増えるたび（または勉強時間がたまるたび）に、飾りが増えます。いまの記録：学習 <b>'+nd+'日</b>・累計 <b>'+hm(m*60)+'</b></p>'+DECOR.map((d,i)=>'<div style="padding:3px 0;opacity:'+(lv>=i?1:.45)+'">'+(lv>=i?'✓ ':'・ ')+d[2]+(i?'<span class="mut" style="font-size:12px">　'+d[0]+'日 または '+d[1]+'分</span>':'')+'</div>').join('')+'<p class="mut" style="font-size:13px;margin:6px 0 0">'+(nx?'次の飾りまで あと '+(nx.days?nx.days+'日の記録':'')+(nx.days&&nx.min?'（または ':'')+(nx.min?nx.min+'分':'')+(nx.days&&nx.min?'）':''):'すべての飾りが解放されています。')+'</p></div>'+
'<div class="card"><h3>模様替え</h3><div class="mut" style="font-size:12px">背景</div><div class="row" style="margin-bottom:6px">'+roomChips('bg',BGS,o.bg)+'</div><div class="mut" style="font-size:12px">服装</div><div class="row" style="margin-bottom:6px">'+roomChips('outfit',OUTFITS,o.outfit)+'</div><div class="mut" style="font-size:12px">照明</div><div class="row">'+roomChips('light',LIGHTS,(S.room&&S.room.light)||'auto')+'</div></div>'}
/* STUDY ROOMのジェイス（自分で動く・撫でられる）*/
let RM={pose:'sit',eye:'open',nextAct:0,nextBlink:0,petAt:0,pet:0};
function rmUpd(pose,eye){RM.pose=pose;RM.eye=eye;const g=document.getElementById('rwolf');if(g)g.innerHTML=wolfG(pose,eye,roomOpt().outfit)}
function rmPet(){if(typeof DN2!=='undefined'&&DN2)return;RM.pet=Date.now()+2200;rmUpd(RM.pose==='lie'?'sit':RM.pose,'happy');if(Date.now()-RM.petAt>9000){RM.petAt=Date.now();stLine=pick('rmp',['…悪くない。','そこ、いい。','ふん。もう少し。'])}}
function rmStroke(e){if(e&&(e.buttons>0||e.pointerType==='touch'))rmPet()}
function rmTick(){if((typeof DN2!=='undefined'&&DN2)||view!=='study'||stTab!=='room')return;const g=document.getElementById('rwolf');if(!g)return;const n=Date.now();
if(RM.pet&&n>RM.pet){RM.pet=0;rmUpd(RM.pose,'open')}if(RM.pet)return;
if(n>RM.nextBlink&&(RM.eye==='open'||RM.eye==='half')){RM.nextBlink=n+3500+Math.random()*4500;const p=RM.pose,e=RM.eye;rmUpd(p,'closed');setTimeout(()=>{if(RM.eye==='closed'&&RM.pose===p)rmUpd(p,e)},170)}
if(n>RM.nextAct){RM.nextAct=n+7000+Math.random()*8000;const o=['sit','sit','gaze','gaze','lie'];const p=o[Math.floor(Math.random()*o.length)];rmUpd(p,p==='lie'?'half':'open')}}
setInterval(rmTick,1000);
function stSet(t){vKeep();stTab=t;stLine=t==='room'?pick('vr',VL.room):t==='vocab'?pick('vo',VL.open):'';render();ambSync()}
const _vStudyRec=vStudy;
vStudy=function(){const tabs='<div class="row" style="margin-bottom:10px">'+[['rec','記録'],['vocab','単語帳'],['room','ROOM']].map(x=>'<button class="sm '+(stTab===x[0]?'on':'ghost')+'" onclick="stSet(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>';
if(stTab==='vocab')return '<h1>STUDY</h1>'+tabs+(vSess?vSessHtml():vHomeHtml());if(stTab==='room')return '<h1>STUDY ROOM</h1>'+tabs+vRoomHtml();return _vStudyRec().replace('<h1>勉強</h1>','<h1>STUDY</h1>'+tabs)};
const _sAdd=sAdd;sAdd=function(){const n=S.study.log.length;_sAdd();if(S.study.log.length>n){vRoomUnlock();save()}};

const _goA=go;go=function(v){_goA(v);ambSync()};
say('open');render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
