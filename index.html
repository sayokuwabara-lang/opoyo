<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DDDDDD">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Grimoire Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#E2E2E3;--card:#F3F3F3;--sub:#D3D3D3;--tx:#2B2B2D;--tx2:#5F6062;--ac:#6D6E70;--ac2:#AAAAAB;--bd:#C2C2C3;--ink:#2A2326;--pg:#555556;--inp:#fff;--h1:#AAAAAB;--h2:#6D6E70;--h3:#3a3a3c;--ph1:#6D6E70;--ph2:#AAAAAB;--ph3:#3a3a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#1b1b1d;--card:#262629;--sub:#35353a;--tx:#e9e9ec;--tx2:#a2a2aa;--ac:#5f5f68;--ac2:#6b6b74;--bd:#3f3f45;--ink:#e9e9ec;--pg:#7b7b86;--inp:#1f1f22;--h1:#4a4a52;--h2:#6a6a73;--h3:#8a8a94;--ph1:#8a8a94;--ph2:#5a5a62;--ph3:#d4d4dc;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.8 "Noto Sans JP","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",sans-serif;font-weight:500;overflow-x:hidden;overscroll-behavior-y:none}
h1,h2,h3{font-weight:700;margin:0 0 8px;letter-spacing:.03em}
h1{font-size:22px;text-align:center}h2{font-size:19px}h3{font-size:17px}
#app{max-width:520px;margin:0 auto;padding:14px 14px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,40,45,.06)}
.card.deco{border-top:3px solid var(--ac2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mut{color:var(--tx2);font-size:15px}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
button.sm{min-height:38px;padding:4px 10px;font-size:15px}
button.on{background:var(--pg);border-color:var(--pg);color:#fff}
input,textarea,select{font:inherit;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--inp);color:var(--tx)}
.bar{height:12px;background:var(--sub);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pg);transition:width .4s}
.bub{background:var(--sub);border-radius:14px;padding:10px 14px}
.bub.t{position:relative;flex:1}.bub.t:before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-left:0;border-right-color:var(--sub)}
.jace{background:none;border:0;padding:0;min-height:0;display:block;margin:0 auto}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.task:first-of-type{border-top:0}
.chk{width:24px;height:24px;min-width:24px;min-height:24px;margin-top:5px;border-radius:50%;padding:0;background:transparent;border:2px solid var(--ac);color:#fff;font-size:13px;line-height:1}
.chk.d{background:var(--pg);border-color:var(--pg)}
.done .tt{text-decoration:line-through;color:var(--tx2)}
nav{position:fixed;left:0;right:0;bottom:0;transform:translateZ(0);-webkit-transform:translateZ(0);background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:transparent;color:var(--tx2);border:0;border-radius:0;font-size:11px;min-height:56px;padding:4px 0;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:9;max-width:88%;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.s{opacity:1}
.tag{display:inline-block;background:var(--sub);border-radius:10px;padding:0 8px;font-size:13px}
.sw{position:relative;overflow:hidden;border-top:1px solid var(--bd)}.sw .task{border-top:0}.acts{position:absolute;right:0;top:0;bottom:0;display:flex}.acts button{min-height:0;height:100%;width:72px;border-radius:0;border:0;padding:0}.acts button.ghost{background:var(--sub);color:var(--tx)}.acts button.del{background:#6b4a4f}.swi{position:relative;background:var(--card);transition:transform .2s;touch-action:pan-y;user-select:none;-webkit-user-select:none}.ov{position:fixed;inset:0;background:rgba(30,30,34,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.mb{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px}
input[type=date],input[type=time]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}.bub.red{background:#B5474E;color:#fff}.bub.t.red:before{border-right-color:#B5474E}
.mb{max-height:88vh;overflow:auto}
.cp{min-height:34px;padding:3px 8px;font-size:14px;border-radius:10px}
.tiny{min-height:0;padding:2px 10px;font-size:12px;background:transparent;color:var(--tx2);border:1px solid var(--bd);border-radius:8px}
.big{font-size:46px;text-align:center;letter-spacing:.08em;font-weight:700}
/* ---- ジェイスの部屋・隠れ家 ---- */
.room{display:block;width:100%;height:auto;border-radius:14px}
.room .r-lt{pointer-events:none}
.room .w-breathe{animation:wB 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.room .w-tail{animation:wT 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
.room .w-z{animation:wZ 4s ease-in-out infinite}
.room .fl{animation:wF 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.room .lt{animation:wL 3.4s ease-in-out infinite}
.room.listen .w-earL{transform:rotate(-9deg);transform-box:fill-box;transform-origin:50% 100%}
.room.listen .w-earR{transform:rotate(9deg);transform-box:fill-box;transform-origin:50% 100%}
@keyframes wH{0%,100%{transform:rotate(0)}30%{transform:rotate(2.2deg) translateY(1px)}62%{transform:rotate(-2deg)}}
.room .w-hw{animation:wH 9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wB{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes wT{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes wZ{50%{transform:translate(4px,-6px)}}
@keyframes wF{0%,100%{transform:scale(1,.94)}40%{transform:scale(1.06,1.1)}70%{transform:scale(.96,.98)}}
@keyframes wL{0%,100%{opacity:.85}35%{opacity:1}60%{opacity:.7}}
.dn2{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;background:radial-gradient(120% 80% at 50% 0%,#141c34 0%,#0a0f1c 70%);color:#c8ccd4;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
.dn2 *{box-sizing:border-box}
.dn2-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px}
.dn2-b{font:inherit;font-size:14px;min-height:36px;padding:5px 14px;border-radius:999px;border:1px solid rgba(200,204,212,.28);background:rgba(14,20,36,.6);color:#c8ccd4;cursor:pointer}
.dn2-b.on{background:rgba(224,160,80,.2);border-color:rgba(224,160,80,.55);color:#f3d9ac}
.dn2-stage{flex:none;width:100%;max-width:560px;margin:0 auto;padding:0 8px}
.dn2-text{min-height:4.2em;padding:12px 24px 2px;text-align:center;font-size:17px;line-height:1.9;color:#dadde4;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity 1.2s}
.dn2-sub{padding:0 24px;text-align:center;font-size:12.5px;line-height:1.7;color:#aab0bc}
.dn2-bot{margin-top:auto;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.dn2-in{display:flex;gap:8px;margin-top:8px}
.dn2-in input{flex:1;min-width:0;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid rgba(200,204,212,.28);background:rgba(14,20,36,.7);color:#e4e6ec;font:inherit;font-size:16px}
.dn2-in input::placeholder{color:#7d8496}
.dn2-sheet{position:absolute;left:12px;right:12px;top:58px;bottom:84px;overflow:auto;padding:12px 14px;border-radius:18px;background:rgba(10,14,28,.95);border:1px solid rgba(200,204,212,.18);display:none}
.dn2-sheet.on{display:block}
.dn2-sheet h4{margin:12px 0 6px;font-size:13px;color:#aab0bc;font-weight:500}
.dn2-sheet h4:first-child{margin-top:0}
.dn2-row{display:flex;flex-wrap:wrap;gap:6px}
.dn2-breath{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(6,9,18,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.dn2-breath.on{display:flex}
.dn2-bc{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(224,160,80,.6),rgba(224,160,80,.14) 62%,rgba(224,160,80,0));transform:scale(.55)}
.dn2-bl{font-size:20px;letter-spacing:.2em;color:#e8c98f}
.rm-chip{font:inherit;font-size:13px;min-height:32px;padding:3px 11px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.rm-chip.on{background:var(--pg);border-color:var(--pg);color:#fff}
.dn2-sheet .rm-chip{border-color:rgba(200,204,212,.28);color:#c8ccd4}
.dn2-sheet .rm-chip.on{background:rgba(224,160,80,.22);border-color:rgba(224,160,80,.55);color:#f3d9ac}

@keyframes wSg{0%,100%{transform:rotate(-2.6deg) translateY(0)}50%{transform:rotate(2.6deg) translateY(-2px)}}
.room.sing .w-hw{animation:wSg .62s ease-in-out infinite}
/* ---- Music English（ダークアカデミア調）---- */
.mu{background:linear-gradient(180deg,#17131c,#0e0c12);color:#e8e2ea;border:1px solid #2a2330;border-radius:16px;padding:12px;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.mu *{box-sizing:border-box}
.mu .mut{color:#9d95a8}
.mu-h{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mu-et{font-size:18px;font-weight:700;letter-spacing:.04em;color:#ecd9de}
.mu-entry{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px 12px}
.mu-eic{flex:none;display:inline-flex}
.mu .mc{background:#1e1a25;border:1px solid #302937;border-radius:12px;padding:10px 12px;margin:8px 0}
.mu .mc.merr{border-color:#8a3a4c;background:#251a20}
.mu .mc.mwarn{border-color:#6a5a3a;background:#231f19}
.mu .mc.mprev{border-color:#5a2a3a}
.mu .mc.mtheme{background:#241a22;border-color:#5a2a3a}
.mu .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu .mst b{display:block;font-size:19px;color:#f1e6ea}
.mu .mst .mut{font-size:12px}
.mu .mb{font:inherit;font-size:15px;min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid #8a3a4c;background:#6a2434;color:#f6e9ee;cursor:pointer}
.mu .mb.sm{min-height:34px;font-size:14px;padding:5px 11px}
.mu .mb.mb2{background:transparent;border-color:#4a4252;color:#d6cfdc}
.mu .mb:disabled{opacity:.45}
.mu .mkb{flex:none;font:inherit;font-size:20px;line-height:1;min-width:40px;min-height:40px;border-radius:10px;border:1px solid #3a3341;background:transparent;color:#cfc7d6}
.mu .mi{width:100%;display:block;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid #3a3341;background:#131018;color:#eee8f0;margin:3px 0}
.mu .mi::placeholder{color:#6f677a}
.mu .ml{display:block;font-size:13px;color:#b9b0c2;margin:10px 0 2px}
.mu .mreq{font-size:11px;color:#e09aa8;margin-left:4px}
.mu .mrow{display:flex;gap:12px;align-items:center;cursor:pointer}
.mu .mtx{flex:1;min-width:0}
.mu .mt1{font-weight:700;font-size:16px;color:#f1e6ea;word-break:break-word}
.mu .mt2{font-size:13px;color:#b9b0c2;word-break:break-word}
.mu .mt3{font-size:12px;color:#8b8396;margin-top:3px}
.mu .mcov{flex:none;border-radius:8px;object-fit:cover;background:#15121a;border:1px solid #302937;display:inline-flex;align-items:center;justify-content:center}
.mu .mchip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid #4a3a46;color:#d9c3cb;background:#251a21;margin:1px 2px 1px 0}
.mu .mchip.mok{border-color:#3d6a4c;color:#a9d6b6;background:#17241b;flex:none}
.mu .mtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.mu .mtab{flex:none;font:inherit;font-size:13px;min-height:36px;padding:5px 12px;border-radius:999px;border:1px solid #3a3341;background:transparent;color:#cfc7d6;white-space:nowrap}
.mu .mtab.on{background:#6a2434;border-color:#8a3a4c;color:#fff}
.mu .mtab .mn{opacity:.6;margin-right:5px;font-size:11px}
.mu .men{font-size:16px;font-weight:700;color:#f3e8ec;word-break:break-word}
.mu .mkv{display:flex;gap:8px;font-size:14px;line-height:1.7;margin-top:3px;word-break:break-word}
.mu .mk{flex:none;min-width:5.5em;font-size:12px;color:#c58b99;padding-top:2px}
.mu .mtags{display:flex;flex-wrap:wrap}
.mu .mq{font-size:15px;margin:8px 0 4px;color:#ece3e8}
.mu .mlink{display:inline-block;margin-top:6px;font-size:14px;color:#e0a0ae}
.mu summary{cursor:pointer;font-size:14px;color:#d6cfdc}
.mu code{font-size:12px;color:#e8b4c0;word-break:break-all}
.mu .bar{background:#2a2330}
.mu .bar i{background:#8a3a4c}
.mu .row.sp{display:flex;justify-content:space-between;align-items:center}
.mu .lr{display:flex;gap:6px;align-items:center;margin:4px 0}
.mu .lr .mi{margin:0;flex:1;min-width:0}
.mu .ln{flex:none;width:26px;text-align:right;font-size:12px;color:#8b8396}
.mu .mline .mlh{display:flex;gap:10px;align-items:flex-start;margin-bottom:2px}
.mu .mn2{flex:none;min-width:22px;font-size:12px;color:#c58b99;padding-top:4px;text-align:right}
.mu .mdt{margin-top:8px;border-top:1px solid #302937;padding-top:6px}
.mu .mdt summary{font-size:13px;color:#e0a0ae;padding:4px 0}
.mu .msec{font-size:12px;letter-spacing:.06em;color:#c58b99;margin:10px 0 2px;border-left:3px solid #6a2434;padding-left:7px}
.mu .mw{padding:6px 0;border-bottom:1px dashed #2e2833}
.mu .mw:last-child{border-bottom:0}
.mu .mdiff{border-top:1px solid #4a2a34;margin-top:8px;padding-top:6px}
.mu .mq2{font-size:14px;background:#14111a;border:1px solid #3a3341;border-radius:8px;padding:6px 8px;word-break:break-word;white-space:pre-wrap;margin-top:2px}

.mu .mwr{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 9px}
.mu .mpr{font-size:13px}
.mu .mmn{font-size:15px;color:#f1e6ea}
.mu .msp{flex:1 1 8px}
.mu .mwb{align-self:center;flex:none;margin-left:auto}
.mu .mwx{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:#cfc7d6;margin-top:3px;line-height:1.6}
.mu .mi2 .mk{min-width:0;margin-right:5px;font-size:11px}

/* ---- ジェイスと歌う ---- */
.sg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:radial-gradient(120% 70% at 50% 0%,#241822 0%,#120d16 62%,#0c0910 100%);color:#ece3e8;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
.sg *{box-sizing:border-box}
.sg-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 6px}
.sg-title{flex:1;min-width:0;text-align:center;font-size:13px;color:#b9a9b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-stage{position:relative;flex:none;width:100%;max-width:520px;margin:0 auto;padding:0 10px;cursor:pointer}
.sg-svg .room{max-height:36vh;width:auto;margin:0 auto}
.sg-notes{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden}
.sg-note{position:absolute;bottom:42%;color:#e0a0ae;opacity:0;text-shadow:0 0 8px rgba(224,160,174,.55);animation:sgUp 2.6s ease-out forwards}
@keyframes sgUp{0%{opacity:0;transform:translateY(0) rotate(-8deg)}15%{opacity:.95}100%{opacity:0;transform:translateY(-120px) translateX(18px) rotate(14deg)}}
.sg-say{min-height:1.6em;padding:4px 22px 0;text-align:center;font-size:14px;color:#c8b4bd}
.sg-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 22px;text-align:center;cursor:pointer;min-height:0;overflow:auto}
.sg-en{font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;font-size:clamp(22px,6.2vw,32px);line-height:1.55;word-break:break-word}
.sg-w{color:#5d5566;transition:color .25s,text-shadow .25s}
.sg-w.on{color:#f6ebef;text-shadow:0 0 12px rgba(224,160,174,.35)}
.sg-ja{margin-top:12px;font-size:15px;line-height:1.7;color:#b5a8b2}
.sg-intro{font-family:'Noto Serif JP','Hiragino Mincho ProN',Georgia,serif;font-size:24px;color:#f1dfe5}
.sg-sub{margin-top:6px;font-size:14px;color:#9d8e99}
.sg-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.sg-ct{font-size:13px;color:#9d8e99}

/* ---- 曲の画面：コンパクトな上部 ---- */
.mu .mhd{padding:8px 10px}
.mu .mhr{display:flex;gap:10px;align-items:center}
.mu .mhs{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-size:12px;color:#c9bfd0;margin-top:6px}
.mu .mhsing{margin-left:auto;min-height:32px}
.mu .mops{margin-top:4px}
.mu .mops summary{font-size:13px;color:#e0a0ae;padding:5px 0;cursor:pointer}
.mu .mops-b{padding-top:2px}
.mu .mops-t{font-size:11px;letter-spacing:.08em;color:#c58b99;margin:8px 0 4px}
.mu .mtheme summary{cursor:pointer;font-size:14px;color:#e7d9de}
.mu .mtheme[open] .mprev{display:none}
.mu .mtheme .mk{min-width:0}
.mu .mtabs{position:relative}
.mu .muai{padding:8px 10px}

/* ===== Grimoire Garden / unified redesign ===== */
:root{
 --bg:#ECECEC;--card:#F7F7F7;--sub:#E3E3E3;--tx:#2B2B2D;--tx2:#6A6B6D;
 --ac:#3A3A3C;--ac2:#B8B8BA;--bd:#D2D2D3;--ink:#2B2B2D;--pg:#3A3A3C;--inp:#FFFFFF;
 --danger:#B5474E;--radius:16px;color-scheme:light;
}
:root[data-theme=dark]{
 --bg:#1B1B1D;--card:#262629;--sub:#35353A;--tx:#E9E9EC;--tx2:#A2A2AA;
 --ac:#E9E9EC;--ac2:#6B6B74;--bd:#3F3F45;--ink:#E9E9EC;--pg:#E9E9EC;--inp:#1F1F22;color-scheme:dark;
}
html{scroll-behavior:smooth}
body{font:16px/1.6 "Noto Sans JP","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",sans-serif;font-weight:400;background:var(--bg);color:var(--tx)}
#app{max-width:520px;padding:16px 16px calc(112px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;line-height:1.4;text-align:left;margin:0 0 14px;letter-spacing:.02em}
h2{font-size:16px;line-height:1.45;margin:0;font-weight:700}
h3{font-size:15px;line-height:1.5;margin:0 0 8px}
.mut{font-size:13px;color:var(--tx2);line-height:1.55}

<script>
const KEY='grimoire_garden_v1';
const SAY={
open:['来たか。無理のない範囲で、少しずつ進めよう。','おかえり。今日も静かに始めればいい。','よく来たな。ゆっくりでいい。'],
done:['一つ片づいたな。少しずつ進めばいい。','よくやった。その一歩は、ちゃんと残る。','終わったか。ひと息ついていい。'],
left:['残ったものは、明日に回してもいい。全部を一度に抱える必要はない。'],
ref:['今日を振り返れたなら、それで十分だ。休むのも大事な一日だ。'],
ms:['少し休もう。今は、何かを成し遂げなくてもいい。'],
me:['おかえり。少しでも落ち着けたなら、それで十分だ。']};
const WORDS=['全部やらなくていい。今日の一つで十分だ。','疲れたなら、先に休め。勉強は逃げない。','うまくいかない日は、続けた日でもある。','小さく始めれば、案外動き出す。','比べるのは昨日の自分だけでいい。','わからないのは、前に進んでいる証拠だ。','深呼吸を一つ。それだけで違う。','終わらせるより、手をつけることを大事にしよう。','休んだことは、失敗じゃない。','今日の自分に、できる分だけ頼めばいい。','机に向かえた。それだけで一歩だ。','焦る夜は、まず水を飲め。'];
const DEFM=[
{id:'m1',n:'月影の呼吸',min:5,g:'気持ちを落ち着ける',d:'呼吸を無理に変えず、自然な呼吸に注意を向けます。'},
{id:'m2',n:'書庫の静寂',min:5,g:'頭の中を整理する',d:'浮かんだ考えに気づき、追い払わず、再び目の前の感覚に注意を戻します。'},
{id:'m3',n:'夜の手放し',min:7,g:'一日の緊張を整理する',d:'今日あったことを思い浮かべ、今すぐ解決しなくてよいことを一度脇に置きます。'},
{id:'m4',n:'足元の休息',min:5,g:'授業の合間や電車で休む',d:'足が床に触れる感覚、手の感覚、周囲の音に注意を向けます。'}];
let MEDS=DEFM.slice();
const DEFMOOD=[['疲れている','m4'],['不安がある','m1'],['頭が散らかっている','m2'],['一日を終えたい','m3']];
let MOODS=DEFMOOD.map(x=>x.slice());
const DEFC=['疲れたとき・休みたいとき','不安や心配があるとき','勇気が必要なとき','希望を持ちたいとき','勉強や判断に知恵が必要なとき','自分を責めてしまうとき','眠る前・静かな時間','感謝や喜びを感じたいとき'];

// s は本文の引用ではなく、内容の短い要約。本文は利用条件を確認した翻訳のみ別途追加する
const DEFV=[
{c:0,r:'マタイによる福音書 11:28',s:'疲れた人、重荷を負う人に向けて、休ませてあげようと呼びかける言葉だ。'},
{c:0,r:'詩編 23:1–3',s:'羊飼いに導かれ、静かな水辺で魂が元気を取り戻す情景を歌っている。'},
{c:1,r:'マタイによる福音書 6:34',s:'明日のことまで思い悩むな、という教えだ。今日の分だけ見ればいい。'},
{c:1,r:'フィリピの信徒への手紙 4:6–7',s:'何も思い煩わず、願いを祈りで伝えれば、心に平安が与えられると語る。'},
{c:2,r:'イザヤ書 41:10',s:'恐れるな、わたしが共にいる、という励ましの言葉だ。'},
{c:2,r:'ヨシュア記 1:9',s:'強く、勇気を持て。どこへ行っても共にいる、という約束だ。'},
{c:3,r:'哀歌 3:22–23',s:'慈しみは尽きず、朝ごとに新しくされる、と語る。昨日がどうでも、今日は新しい。'},
{c:3,r:'ローマの信徒への手紙 8:28',s:'すべてのことが、最終的には益になるよう働くという希望を語る。'},
{c:4,r:'箴言 2:6',s:'知恵は与えられるものだ、と語る。知ることは贈り物でもある。'},
{c:4,r:'ヤコブの手紙 1:5',s:'知恵に欠けるなら、求めればよい。ためらわず頼っていい、という言葉だ。'},
{c:5,r:'詩編 34:18',s:'心の砕けた人のそばに寄り添う、という言葉だ。落ち込む日も一人ではない。'},
{c:5,r:'ローマの信徒への手紙 8:38–39',s:'どんなものも、神の愛から自分を引き離せないと語る。失敗しても変わらない。'},
{c:6,r:'詩編 4:8',s:'安らかに横になり、眠れる、という夜の祈りの言葉だ。'},
{c:6,r:'詩編 121:7–8',s:'出入りのすべてを見守ってくれる、という守りの約束を歌う。'},
{c:7,r:'詩編 118:24',s:'今日という日を喜び祝おう、という呼びかけだ。'},
{c:7,r:'テサロニケの信徒への手紙一 5:16–18',s:'いつも喜び、絶えず祈り、どんなことにも感謝する、という勧めだ。'}];
let VERSES=[];function syncV(){if(!Array.isArray(S.verses)||!S.verses.length){S.verses=DEFV.map((v,i)=>({c:v.c,r:v.r,s:v.s,text:(S.vtext&&S.vtext[i])||'',tr:''}));save()}VERSES=S.verses;if(!S.water)S.water={goal:2000,log:{}};if(S.water.goal<100)S.water.goal=2000;if(!Array.isArray(S.water.presets))S.water.presets=[100,200,300,500];S.study=Object.assign({subs:['国語','数学','英語'],log:[],pw:25,pb:5,tm:30},S.study||{});if(!Array.isArray(S.medC))S.medC=[];MEDS=DEFM.concat(S.medC,EXTRA);if(!Array.isArray(S.cats)||!S.cats.length)S.cats=DEFC.slice();CATS=S.cats;if(!Array.isArray(S.moods)||!S.moods.length)S.moods=DEFMOOD.map(x=>x.slice());MOODS=S.moods;S.nav=(Array.isArray(S.nav)?S.nav:[]).filter(k=>TABS.some(t=>t[0]===k));TABS.forEach(t=>{if(!S.nav.includes(t[0]))S.nav.push(t[0])})}

const jst=(t=Date.now())=>new Date(t+9*36e5).toISOString().slice(0,10);
const addDay=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function fresh(){return{v:2,tasks:[],assign:[],recur:[],water:{goal:8,int:2,log:{}},refl:{},meds:[],favs:[],vhist:{},vtext:{}}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(fresh(),JSON.parse(r),{v:2})}catch(e){}return fresh()}
let S=load(),view='home',filter='today',rd=jst(),vcat=-1,vq='',saying='',last={},tm=null,mood=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存に失敗しました。ブラウザの保存設定を確認してください')}}
function toast(m){const t=$('toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}
function pick(k,a){let c=a.filter(x=>x!==last[k]);c=c.length?c:a;const s=c[Math.floor(Math.random()*c.length)];last[k]=s;return s}
function say(k){sref='';sayMode='word';return saying=pick(k,SAY[k])}
function hash(d){let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;return h}
function talk(){sref='';saying=pick('w',WORDS);render()}
function readVerse(i){const v=VERSES[i];saying=v.r+'。'+v.s+(S.vtext[i]?'':'　本文は、お手持ちの聖書で読んでみてくれ。');render()}

return '<svg viewBox="0 -4 200 200" width="170" height="170" role="img" aria-label="ジェイス" style="display:block">'+
'<path d="M140 168 Q186 160 178 108 Q160 116 146 140Z" fill="'+F+'"'+st+'/><path d="M178 108 Q174 132 158 140 Q170 126 178 108Z" fill="'+C+'"/>'+
'<path d="M64 120 Q58 170 68 186 L132 186 Q142 170 136 120Z" fill="'+F+'"'+st+'/><path d="M82 120 L92 146 L100 138 L108 146 L118 120Z" fill="'+C+'"/>'+
'<ellipse cx="76" cy="184" rx="18" ry="11" fill="'+C+'"'+st+'/><ellipse cx="124" cy="184" rx="18" ry="11" fill="'+C+'"'+st+'/>'+
'<path d="M44 72 L36 14 L88 48Z" fill="'+F+'"'+st+'/><path d="M156 72 L164 14 L112 48Z" fill="'+F+'"'+st+'/><path d="M49 58 L46 28 L70 46Z" fill="'+P+'"/><path d="M151 58 L154 28 L130 46Z" fill="'+P+'"/>'+
'<path d="M30 92 Q28 40 100 40 Q172 40 170 92 Q172 126 100 132 Q28 126 30 92Z" fill="'+F+'"'+st+'/>'+
'<path d="M50 102 Q58 84 84 92 Q100 97 116 92 Q142 84 150 102 Q146 126 100 130 Q54 126 50 102Z" fill="'+C+'"/><ellipse cx="72" cy="72" rx="11" ry="5" fill="'+C+'"/><ellipse cx="128" cy="72" rx="11" ry="5" fill="'+C+'"/>'+
'<ellipse cx="62" cy="106" rx="9" ry="6" fill="'+P+'"/><ellipse cx="138" cy="106" rx="9" ry="6" fill="'+P+'"/>'+
'<ellipse cx="76" cy="88" rx="9" ry="11" fill="'+O+'"/><ellipse cx="124" cy="88" rx="9" ry="11" fill="'+O+'"/><circle cx="79" cy="84" r="3.2" fill="#fff"/><circle cx="127" cy="84" r="3.2" fill="#fff"/><circle cx="73" cy="93" r="1.5" fill="#fff"/><circle cx="121" cy="93" r="1.5" fill="#fff"/>'+
'<ellipse cx="100" cy="102" rx="8" ry="6" fill="'+O+'"/><path d="M88 110 Q94 118 100 111 Q106 118 112 110" fill="none" stroke="'+O+'" stroke-width="3" stroke-linecap="round"/></svg>'}

function toggle(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
if(!t.done){t.done=true;t.doneAt=Date.now();t.doneDate=jst();say('done');toast('完了しました')}
else{t.done=false;t.doneAt=null;t.doneDate=null;toast('完了を取り消しました')}
save();render()}
function addTask(){const n=$('tn').value.trim();if(!n)return toast('タスク名を入力してください');const rp=$('tr').value;if(rp!=='none'){const sd=$('td').value||jst(),wd=new Date(Date.parse(sd+'T00:00:00Z')).getUTCDay();S.recur.push({id:'r'+Date.now(),name:n,memo:$('tm').value.trim(),rep:rp,wd,start:sd,last:''});save();toast('くりかえしタスクを追加しました');render();return}
S.tasks.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,5),name:n,memo:$('tm').value.trim(),date:$('td').value||jst(),created:Date.now(),done:false,doneAt:null,doneDate:null});
save();toast('追加しました');render()}
function editTask(id){const t=S.tasks.find(x=>x.id===id);const n=prompt('タスク名',t.name);if(n===null)return;const m=prompt('メモ',t.memo||'');const d=prompt('予定日 (YYYY-MM-DD)',t.date);
if(n.trim())t.name=n.trim();if(m!==null)t.memo=m;if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d))t.date=d;save();render()}
function delTask(id){if(!confirm('このタスクを削除しますか？'))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function moveTask(id){const t=S.tasks.find(x=>x.id===id);const n=addDay(t.date,1);if(!confirm('「'+t.name+'」の予定日を '+n+' に移動しますか？'))return;t.date=n;save();toast('翌日へ移動しました');render()}
function taskRow(t,ctl){return '<div class="task '+(t.done?'done':'')+'"><button class="chk '+(t.done?'d':'')+'" onclick="toggle(\''+t.id+'\')" aria-label="完了">'+(t.done?'✓':'')+'</button><div style="flex:1;min-width:0"><div class="tt">'+(t.rid?'↻ ':'')+esc(t.name)+'</div><div class="mut">予定 '+t.date+(t.done?' ／ 完了 '+t.doneDate:'')+'</div>'+(t.memo?'<div class="mut">'+esc(t.memo)+'</div>':'')+(ctl||'<div class="row"><button class="ghost sm" onclick="editTask(\''+t.id+'\')">編集</button><button class="ghost sm" onclick="delTask(\''+t.id+'\')">削除</button></div>')+'</div></div>'}

function vToday(){const d=jst();if(S.vhist[d]==null){S.vhist[d]=hash(d)%VERSES.length;save()}return S.vhist[d]}
function fav(i){const k=S.favs.indexOf(i);k<0?S.favs.push(i):S.favs.splice(k,1);save();toast(k<0?'お気に入りに追加':'お気に入りを解除');render()}
function saveVT(i,el){const t=el.value.trim();if(t)S.vtext[i]=t;else delete S.vtext[i];save();toast('保存しました')}
function vCard(i){const v=VERSES[i],f=S.favs.includes(i);return '<div class="card"><span class="tag">'+CATS[v.c]+'</span><h3 style="margin-top:6px">'+v.r+'</h3><p class="mut" style="margin:0 0 8px">'+esc(v.s)+'（内容の要約）</p>'+
'<textarea rows="2" placeholder="お手持ちの聖書の本文を貼り付けて保存（自分用）" onchange="saveVT('+i+',this)">'+esc(S.vtext[i]||'')+'</textarea><div class="row" style="margin-top:8px"><button class="sm" onclick="readVerse('+i+');go(\'home\')">ジェイスに話してもらう</button><button class="'+(f?'on':'ghost')+' sm" onclick="fav('+i+')">'+(f?'★ お気に入り':'☆ お気に入り')+'</button></div></div>'}

function recMed(){const m=MOODS.find(x=>x[0]===mood);return MEDS.find(x=>x.id===(m?m[1]:'m1'))}
function startMed(id){const m=MEDS.find(x=>x.id===id);unlockAudio();tm={id,ms:m.min*60000,tot:m.min*60000,end:Date.now()+m.min*60000,run:true,fin:false,mood:mood||'',after:'',note:''};say('ms');render();tick()}
function tick(){clearInterval(tick.h);tick.h=setInterval(()=>{if(!tm||!tm.run)return;const r=tm.end-Date.now();if(r<=0){tm.run=false;tm.fin=true;tm.ms=0;clearInterval(tick.h);howl();say('me');render();return}const e=$('tmr');if(e)e.textContent=fmt(r)},250)}
const fmt=r=>{const s=Math.ceil(r/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function pause(){tm.ms=tm.end-Date.now();tm.run=false;render()}
function resume(){tm.end=Date.now()+tm.ms;tm.run=true;render();tick()}
function stopMed(){tm=null;clearInterval(tick.h);render()}
function saveMedNote(){S.meds.push({d:jst(),t:Date.now(),id:tm.id,min:Math.max(1,Math.round((tm.tot-tm.ms)/60000)),mood:tm.mood,after:tm.after,note:(tm.note||'').trim(),early:!!tm.early});save();toast('記録しました');tm=null;render()}
function endMed(){const r=tm.run?Math.max(0,tm.end-Date.now()):tm.ms;tm.run=false;tm.fin=true;tm.ms=r;tm.early=r>0;clearInterval(tick.h);say('me');render()}
function genRecur(){const td=jst(),wd=new Date(Date.parse(td+'T00:00:00Z')).getUTCDay();let ch=0;S.recur.forEach(r=>{const ok=r.rep==='daily'||(r.rep==='weekdays'&&wd>0&&wd<6)||(r.rep==='weekly'&&r.wd===wd);if(ok&&r.last!==td&&td>=r.start){r.last=td;ch=1;if(!S.tasks.some(t=>t.rid===r.id&&t.date===td))S.tasks.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,5),rid:r.id,name:r.name,memo:r.memo,date:td,created:Date.now(),done:false,doneAt:null,doneDate:null})}});if(ch)save()}
function stopRecur(id){if(!confirm('このくりかえしを止めますか？（すでに作られたタスクは残ります）'))return;S.recur=S.recur.filter(r=>r.id!==id);save();render()}
function medLog(){const ds=[...new Set(S.meds.map(x=>x.d))],td=jst();let c=0,d=ds.includes(td)?td:addDay(td,-1);while(ds.includes(d)){c++;d=addDay(d,-1)}
const wk=S.meds.filter(x=>x.d>=addDay(td,-6)),tot=S.meds.reduce((a,x)=>a+(x.min||0),0),wm=wk.reduce((a,x)=>a+(x.min||0),0);
return '<div class="card"><h3>瞑想の記録</h3><p style="margin:0">連続 <b>'+c+'</b> 日 ／ 直近7日 <b>'+wk.length+'</b> 回・'+wm+'分 ／ 累計 '+tot+'分</p><p class="mut" style="margin:0 0 6px">休んだ日があっても、記録は消えません。</p>'+(S.meds.length?S.meds.slice(-7).reverse().map(x=>{const m=MEDS.find(m=>m.id===x.id);return '<p class="mut" style="margin:0;border-top:1px solid var(--bd);padding:4px 0">'+x.d+' '+(m?m.n:'')+(x.min?' '+x.min+'分':'')+(x.mood||x.after?'<br>気分：'+(x.mood||'—')+' → '+(x.after||'—'):'')+(x.note?'<br>'+esc(x.note):'')+'</p>'}).join(''):'<p class="mut">まだ記録はありません。</p>')+'</div>'}
function modal(h){let m=$('md');if(!m){m=document.createElement('div');m.id='md';m.className='ov';document.body.appendChild(m)}m.innerHTML='<div class="mb">'+h+'</div>';m.style.display='flex'}
function closeM(){const m=$('md');if(m)m.style.display='none'}
let mcb=null;
function ask(msg,ok,fn){mcb=fn;modal('<p style="margin:0 0 12px">'+msg+'</p><div class="row"><button onclick="closeM();mcb()">'+ok+'</button><button class="ghost" onclick="closeM()">キャンセル</button></div>')}
function delTask(id){ask('このタスクを削除しますか？','削除する',()=>{S.tasks=S.tasks.filter(x=>x.id!==id);save();render();toast('削除しました')})}
function moveTask(id){const t=S.tasks.find(x=>x.id===id),n=addDay(t.date,1);ask('「'+esc(t.name)+'」の予定日を '+n+' に移動しますか？','移動する',()=>{t.date=n;save();toast('翌日へ移動しました');render()})}
function editTask(id){const t=S.tasks.find(x=>x.id===id);modal('<h3>タスクを編集</h3><input id="en" value="'+esc(t.name)+'" style="margin-bottom:6px"><input id="em" value="'+esc(t.memo||'')+'" placeholder="メモ" style="margin-bottom:6px"><input id="ed" type="date" value="'+t.date+'" style="margin-bottom:10px"><div class="row"><button onclick="saveEdit(\''+id+'\')">保存</button><button class="ghost" onclick="closeM()">キャンセル</button></div>')}
function saveEdit(id){const t=S.tasks.find(x=>x.id===id),n=$('en').value.trim();if(!n)return toast('タスク名を入力してください');t.name=n;t.memo=$('em').value.trim();if($('ed').value)t.date=$('ed').value;save();closeM();render();toast('保存しました')}
function stopRecur(id){ask('このくりかえしを止めますか？（すでに作られたタスクは残ります）','止める',()=>{S.recur=S.recur.filter(r=>r.id!==id);save();render()})}
function wipe(){ask('すべてのデータを消去します。元に戻せません。','消去する',()=>{S=fresh();save();render()})}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tasks))throw 0;ask('現在のデータを読み込んだ内容で置き換えますか？','置き換える',()=>{S=Object.assign(fresh(),d,{v:2});save();render();toast('読み込みました')})}catch(e){toast('読み込めないファイルです')}};r.readAsText(f)}
function taskRow(t,ctl){const body='<button class="chk'+(t.done?' d':'')+'" onclick="toggle(\''+t.id+'\')" aria-label="完了">'+(t.done?'✓':'')+'</button><div style="flex:1;min-width:0"><div class="tt">'+(t.rid?'↻ ':'')+esc(t.name)+'</div><div class="mut">予定 '+t.date+(t.done?' ／ 完了 '+t.doneDate:'')+'</div>'+(t.memo?'<div class="mut">'+esc(t.memo)+'</div>':'')+(ctl||'')+'</div>';
if(ctl)return '<div class="task '+(t.done?'done':'')+'">'+body+'</div>';
return '<div class="sw"><div class="acts"><button class="ghost" onclick="editTask(\''+t.id+'\')">編集</button><button class="del" onclick="delTask(\''+t.id+'\')">削除</button></div><div class="swi task '+(t.done?'done':'')+'">'+body+'</div></div>'}

g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.6);g.gain.setValueAtTime(0.22,t+2.4);g.gain.exponentialRampToValueAtTime(0.0001,t+3.8);

function chimeBytes(sr){const n=Math.floor(sr*2.6),o=new Uint8Array(n);for(let i=0;i<n;i++){const t=i/sr;let v=0;[0,1.1].forEach(s=>{if(t>=s){const u=t-s;v+=Math.exp(-u*2.2)*(0.55*Math.sin(2*Math.PI*880*u)+0.3*Math.sin(2*Math.PI*1320*u)+0.15*Math.sin(2*Math.PI*1760*u))}});o[i]=Math.max(0,Math.min(255,Math.round(128+v*100)))}return o}
function almStop(){if(alm){try{alm.pause()}catch(e){}alm=null}}
function almStart(sec){almStop();try{const sr=8000,ch=chimeBytes(sr),n=Math.floor(sr*sec),len=n+ch.length,b=new Uint8Array(44+len),dv=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};w(0,'RIFF');dv.setUint32(4,36+len,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,len,true);b.fill(128,44,44+n);b.set(ch,44+n);alm=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));alm.play().catch(()=>{alm=null})}catch(e){alm=null}}
function chimeWeb(){try{unlockAudio();const t=AC.currentTime;[0,1.1].forEach(s=>[880,1320].forEach((f,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+s);g.gain.exponentialRampToValueAtTime(j?0.08:0.18,t+s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+s+1.8);o.connect(g);g.connect(AC.destination);o.start(t+s);o.stop(t+s+1.9)}))}catch(e){}}

function aLater(cur,fn,sMin,sMax,rate){const ms=(sMin+Math.random()*(sMax-sMin))*1000/(rate||1);const id=setTimeout(()=>{if(ACUR===cur&&!cur.stopped)fn()},ms);cur.t.push(id)}
function aAcc(cur,lay,fn,sMin,sMax,first){const rate=(cur.period==='late'?1.5:1);const go=()=>{const a=AA;if(!a)return;const now=Date.now();if(now-cur.lastAcc<7000){aLater(cur,go,4,9);return}cur.lastAcc=now;fn(a,cur,lay);aLater(cur,go,sMin,sMax,rate)};aLater(cur,go,first[0],first[1])}
function aNode(a,lay,n,dry,wet){const d=a.createGain();d.gain.value=dry;n.connect(d);d.connect(lay.g);if(wet>0){const w=a.createGain();w.gain.value=wet;n.connect(w);w.connect(lay.w)}return d}
function aLoop(a,lay,type,sec,filters,gain,wet){const s=a.createBufferSource();s.buffer=aNoise(a,type,sec);s.loop=true;let n=s;filters.forEach(f=>{const x=a.createBiquadFilter();x.type=f[0];x.frequency.value=f[1];if(f[2])x.Q.value=f[2];n.connect(x);n=x});s.start();lay.nodes.push(s);return aNode(a,lay,n,gain,wet||0)}

function aBurst(a,lay,t,dur,type,f,q,peak,dry,wet,sweepTo){const s=a.createBufferSource();s.buffer=aNoise(a,type,2);const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f,t);if(sweepTo)fl.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);fl.Q.value=q;const g=a.createGain();aEnv(a,g,t,Math.min(0.02,dur/4),peak,dur);s.connect(fl);fl.connect(g);g.connect(lay.g);if(wet){const w=a.createGain();w.gain.value=wet;g.connect(w);w.connect(lay.w)}s.start(t,Math.random()*1.2);s.stop(t+dur+0.2)}

else if(id==='glass'){const s=a.createBufferSource();s.buffer=aDrops(a,6.3,260,0.5,0.002,0.006,0.5,0.9);s.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4200;bp.Q.value=0.6;const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=2200;s.connect(bp);bp.connect(hp);s.start();lay.nodes.push(s);aNode(a,lay,hp,0.55,0.05)}

else if(id==='insect'){[4200,4650,5100].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();o.frequency.value=f;g.gain.value=0;l.frequency.value=5+i*1.3;lg.gain.value=0.012;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(lay.g);o.start();l.start();lay.nodes.push(o,l);const drift=()=>{try{l.frequency.setTargetAtTime(4+Math.random()*5,a.currentTime,2)}catch(e){}aLater(cur,drift,8,20)};aLater(cur,drift,6,14)})}

/* ===== 今週の作戦室 ===== */
function wkEnsure(){if(!S.week||typeof S.week!=='object')S.week={goal:'',blocks:[],picks:[]};if(!Array.isArray(S.week.blocks))S.week.blocks=[];if(!Array.isArray(S.week.picks))S.week.picks=[];if(typeof S.week.goal!=='string')S.week.goal='';return S.week}
function wkMonday(d){d=d||jst();return addDay(d,-((new Date(d+'T00:00:00Z').getUTCDay()+6)%7))}
function wkItems(td){const W=wkEnsure(),out=[];
W.blocks.filter(b=>b.date===td).slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')).forEach(b=>out.push({k:'b',id:b.id,title:b.title,time:b.time||'',done:!!b.done,kind:b.kind||'その他'}));
W.picks.forEach(p=>{const pt=p.split(':'),t=pt[0],id=pt.slice(1).join(':');if(t==='t'){const x=S.tasks.find(v=>v.id===id);if(x&&x.date===td)out.push({k:'t',id:x.id,title:x.name,time:x.tm||'',done:!!x.done,kind:'タスク'})}else if(t==='a'){const x=S.assign.find(v=>v.id===id);if(x)out.push({k:'a',id:x.id,title:x.name,time:'',done:!!x.done,kind:'課題'})}});
return out}
function wkProg(td){const W=wkEnsure(),tt=S.tasks.filter(t=>t.date===td),bl=W.blocks.filter(b=>b.date===td),tot=tt.length+bl.length,dn=tt.filter(t=>t.done).length+bl.filter(b=>b.done).length;return{tot:tot,dn:dn,pct:tot?Math.round(dn/tot*100):0}}
function wkTodayList(td){const W=wkEnsure(),out=[],seen={};
const push=(k,id,title,time,done,kind,pick,sub)=>{const key=k+':'+id;if(seen[key])return;seen[key]=1;out.push({k:k,id:id,title:title,time:time||'',done:!!done,kind:kind,pick:!!pick,sub:sub||''})};
W.picks.forEach(p=>{const pt=p.split(':'),t=pt[0],id=pt.slice(1).join(':');
if(t==='t'){const x=S.tasks.find(v=>v.id===id);if(x&&x.date===td)push('t',x.id,x.name,x.tm,x.done,'タスク',1,'')}
else if(t==='a'){const x=S.assign.find(v=>v.id===id);if(x)push('a',x.id,x.name,'',x.done,'課題',1,'締切 '+x.due)}});
W.blocks.filter(b=>b.date===td).forEach(b=>push('b',b.id,b.title,b.time,b.done,b.kind||'その他',0,''));
S.tasks.filter(t=>t.date===td).forEach(t=>push('t',t.id,t.name,t.tm,t.done,'タスク',0,''));
S.assign.filter(a=>!a.done&&a.due&&a.due<=td).forEach(a=>push('a',a.id,a.name,'',a.done,'課題',0,a.due<td?'締切 '+a.due+'（過ぎています）':'今日が締切'));
out.sort((x,y)=>(x.done-y.done)||((y.pick?1:0)-(x.pick?1:0))||((x.time||'99:99').localeCompare(y.time||'99:99')));
return out}

const dueWeek=S.assign.filter(a=>!a.done&&a.due>=mon&&a.due<=days[6]).slice().sort((a,b)=>a.due.localeCompare(b.due));
let warn='';if(new Date(td+'T00:00:00Z').getUTCDay()===5){const wknd=S.assign.filter(a=>!a.done&&(a.due===days[5]||a.due===days[6])).length+W.blocks.filter(b=>!b.done&&(b.date===days[5]||b.date===days[6])).length;if(wknd)warn='<div class="wk-warn">金曜日です。土日に未完了が '+wknd+' 件残っています。土曜に溜まる前に、今日の作戦へ入れておきましょう。</div>'}
const candT=S.tasks.filter(t=>t.date===td),candA=S.assign.filter(a=>!a.done&&a.due<=td);
let h='<h1>✦ 今週の作戦室</h1><button class="ghost sm" style="margin-bottom:10px" onclick="go(\'home\')">◀ ホームへ戻る</button>'+warn+
'<div class="card"><h3>週の作戦目標</h3><input value="'+esc(W.goal)+'" placeholder="今週の目標をひとつ" onchange="wkGoalSave(this.value)"></div>'+
'<div class="card"><h3>今日の作戦（'+pr.dn+' / '+pr.tot+'）</h3>'+(pr.tot?'<div class="bar" style="margin-bottom:8px"><i style="width:'+pr.pct+'%"></i></div>':'')+
(items.length?items.map(i=>'<div class="task-row '+(i.done?'done':'')+'"><button class="chk'+(i.done?' d':'')+'" onclick="wkTogItem(\''+i.k+'\',\''+i.id+'\')" aria-label="完了">'+(i.done?'✓':'')+'</button><div class="task-main"><div class="tt">'+esc(i.title)+'</div><div class="mut">'+(i.time?esc(i.time)+' ・ ':'')+esc(i.kind)+'</div></div></div>').join(''):'<p class="mut">まだ選ばれていません。下の候補から今日の3つを選んでください。</p>')+'</div>'+
'<div class="card"><h3>今日やる3つを選ぶ</h3>'+(candT.length||candA.length?candT.map(t=>{const key='t:'+t.id,on=W.picks.includes(key);return '<div class="row sp" style="padding:4px 0"><span>'+(t.done?'✓ ':'')+esc(t.name)+' <span class="mut">タスク</span></span><button class="sm '+(on?'':'ghost')+'" onclick="wkPickToggle(\''+key+'\')">'+(on?'作戦に入っている':'作戦に入れる')+'</button></div>'}).join('')+candA.map(a=>{const key='a:'+a.id,on=W.picks.includes(key);return '<div class="row sp" style="padding:4px 0"><span>'+esc(a.name)+' <span class="mut">課題・期限 '+md(a.due)+'</span></span><button class="sm '+(on?'':'ghost')+'" onclick="wkPickToggle(\''+key+'\')">'+(on?'作戦に入っている':'作戦に入れる')+'</button></div>'}).join(''):'<p class="mut">今日のタスクと、期限が来ている課題がありません。</p>')+'</div>'+
'<div class="card"><h3>今週締切の課題</h3>'+(dueWeek.length?dueWeek.map(a=>'<div class="row sp" style="padding:4px 0"><span>'+esc(a.name)+'</span><span class="tag" style="background:'+(dleft(a.due)<0?'#B5474E':'var(--sub)')+';color:'+(dleft(a.due)<0?'#fff':'var(--tx2)')+'">期限 '+md(a.due)+'</span></div>').join(''):'<p class="mut">今週が締切の課題はありません。</p>')+'</div>'+
'<div class="card"><div class="row sp"><h3 style="margin:0">週間ボード</h3><button class="sm" onclick="wkAddForm()">＋ ブロック追加</button></div>'+
days.map((d,di)=>{const bl=W.blocks.filter(b=>b.date===d).slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')),tk=S.tasks.filter(t=>t.date===d),as=S.assign.filter(a=>a.due===d);
return '<div class="wk-day"><div class="row sp"><b>'+md(d)+'（'+'月火水木金土日'[di]+'）'+(d===td?' <span class="tag">今日</span>':'')+'</b><button class="tiny ghost" onclick="wkAddForm(\''+d+'\')">＋ 追加</button></div>'+
bl.map(b=>'<div class="task-row '+(b.done?'done':'')+'"><button class="chk'+(b.done?' d':'')+'" onclick="wkTogItem(\'b\',\''+b.id+'\')" aria-label="完了">'+(b.done?'✓':'')+'</button><div class="task-main"><div class="tt">'+(b.time?esc(b.time)+' ':'')+esc(b.title)+'</div><div class="mut">'+esc(b.kind)+(b.memo?' ・ '+esc(b.memo):'')+'</div></div><button class="tiny ghost" onclick="wkMoveBlock(\''+b.id+'\')">翌日へ</button><button class="tiny ghost" onclick="wkDelBlock(\''+b.id+'\')">削除</button></div>').join('')+
tk.map(t=>'<div class="mut" style="font-size:13px;padding:2px 0">・'+(t.done?'✓ ':'')+esc(t.name)+'（タスク）</div>').join('')+
as.map(a=>'<div class="mut" style="font-size:13px;padding:2px 0">・'+(a.done?'✓ ':'')+esc(a.name)+'（課題の期限）</div>').join('')+
(!bl.length&&!tk.length&&!as.length?'<div class="mut" style="font-size:13px">予定なし</div>':'')+'</div>'}).join('')+
'<div class="row" style="margin-top:10px"><button class="ghost" onclick="wkCarryAll()">未完了を全部今日へ移す</button></div></div>';
return h}

say('open');render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
